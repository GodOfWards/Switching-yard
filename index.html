<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d1f">
<title>Switching Game</title>
<style>
  :root { --bg: #1b1d1f; --ground: #2a2d2a; --fg: #d8d4cc; --muted: #8a867e; --line: #3a3d3a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, sans-serif; overscroll-behavior: none; }
  /* Phone held upright is the target. The yard fills the screen and the
     controls sit along the bottom, in thumb reach. The safe-area paddings
     keep both clear of notches and the home bar. */
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  #view { flex: 1; min-height: 0; position: relative; background: var(--ground); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #bar { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  #readout { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  #readout small { display: block; color: var(--muted); font-size: 12px; }
  #bar button { min-width: 56px; min-height: 56px; border-radius: 10px; border: 1px solid var(--line);
    background: #262a30; color: var(--fg); font: 600 22px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #bar button:active { background: #343a42; }
  #bar #stopBtn { font-size: 15px; }
</style>
</head>
<body>
<div id="view"><canvas id="yard"></canvas></div>
<div id="bar">
  <div id="readout"></div>
  <button id="backBtn" aria-label="Throttle back">−</button>
  <button id="stopBtn">Stop</button>
  <button id="fwdBtn" aria-label="Throttle forward">+</button>
</div>
<script>
"use strict";
(() => {
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // One self-contained file, no build step, no dependencies. Content and
  // mechanics are kept apart so a pass can touch one without the other.
  //
  //   CONFIG       version and every tunable game rule, as named constants.
  //   WORLD DATA   the yard: track nodes, segments between them, switches.
  //                Content passes (a new siding, a new yard) touch only this.
  //   STATE        what changes while playing: switch positions, rolling
  //                stock positions and speeds. Built from WORLD DATA by
  //                makeState(); never edits WORLD DATA.
  //   UTILITIES    small geometry and lookup helpers.
  //   SIMULATION   advances STATE by one fixed step, step(dt). All movement
  //                rules live here. The loop calls it at a fixed rate, so
  //                behaviour never depends on the display's frame rate.
  //   ACTIONS      what the player can do (throttle, throw a switch). They
  //                change STATE; they never draw.
  //   PERSISTENCE  none yet. When saving arrives, SAVE_KEY changes with every
  //                change to the saved shape.
  //   RENDERING    draws STATE to the canvas. It never holds rules.
  //   INPUT / LOOP keyboard and mouse to ACTIONS; the fixed-step loop.
  //
  // Coordinates are metres, +x east, +y south. They are the world's, not the
  // screen's: RENDERING fits the yard to the screen and, on a portrait screen,
  // turns it a quarter so the yard runs up the screen (see makeView()).
  // Identity is an id string, never an array index.
  // ==================================================

  // ==================================================
  // CONFIG
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.1.1" };
  const STEP_SECONDS = 1 / 60;          // fixed simulation step
  const MAX_STEPS_PER_FRAME = 5;        // drop time rather than spiral after a stall
  const VIEW_MARGIN = 8;                // metres of ground kept around the yard
  const THROTTLE_NOTCHES = 4;           // per direction
  const SPEED_PER_NOTCH = 2;            // m/s at each notch; retunable (yard speeds are slow)
  const ACCELERATION = 0.6;             // m/s², retunable
  const BRAKING = 1.5;                  // m/s², retunable
  const SWITCH_TAP_RADIUS_PX = 32;      // CSS px from a switch that a tap counts; retunable (a fingertip)
  const LOCO_LENGTH = 14;               // metres

  // ==================================================
  // WORLD DATA
  // ==================================================
  // A small yard: a main line with a two-switch ladder into two sidings.
  // Every segment is a straight line from node `a` to node `b`. A switch sits
  // on a node: `trunk` is the single-track side, `legs` the two diverging
  // routes, and `normal` the leg it starts set to.
  const NODES = {
    westEnd:   { x: 10,  y: 40 },
    sw1:       { x: 70,  y: 40 },
    eastEnd:   { x: 230, y: 40 },
    sw2:       { x: 95,  y: 65 },
    s1End:     { x: 220, y: 65 },
    s2Bend:    { x: 120, y: 90 },
    s2End:     { x: 210, y: 90 },
  };
  const SEGMENTS = {
    mainWest:  { a: "westEnd", b: "sw1" },
    mainEast:  { a: "sw1",     b: "eastEnd" },
    lead:      { a: "sw1",     b: "sw2" },
    siding1:   { a: "sw2",     b: "s1End" },
    s2Curve:   { a: "sw2",     b: "s2Bend" },
    siding2:   { a: "s2Bend",  b: "s2End" },
  };
  const SWITCHES = {
    sw1: { trunk: "mainWest", legs: ["mainEast", "lead"],     normal: "mainEast" },
    sw2: { trunk: "lead",     legs: ["siding1", "s2Curve"],   normal: "siding1" },
  };
  const START_LOCO = { id: "loco1", segment: "mainWest", s: 30, facing: 1 };

  // ==================================================
  // STATE
  // ==================================================
  function makeState() {
    const switches = {};
    for (const id in SWITCHES) switches[id] = { set: SWITCHES[id].normal };
    return {
      switches,
      locos: [{ ...START_LOCO, speed: 0, throttle: 0 }],
    };
  }
  let state = makeState();

  // ==================================================
  // UTILITIES
  // ==================================================
  function segmentLength(segId) {
    const { a, b } = SEGMENTS[segId];
    return Math.hypot(NODES[b].x - NODES[a].x, NODES[b].y - NODES[a].y);
  }
  // The point `s` metres from a segment's `a` end, and the unit vector a→b.
  function pointOn(segId, s) {
    const { a, b } = SEGMENTS[segId];
    const len = segmentLength(segId);
    const ux = (NODES[b].x - NODES[a].x) / len, uy = (NODES[b].y - NODES[a].y) / len;
    return { x: NODES[a].x + ux * s, y: NODES[a].y + uy * s, ux, uy };
  }
  // Segments meeting at each node, built once from WORLD DATA.
  const SEGMENTS_AT = {};
  for (const id in NODES) SEGMENTS_AT[id] = [];
  for (const id in SEGMENTS) {
    SEGMENTS_AT[SEGMENTS[id].a].push(id);
    SEGMENTS_AT[SEGMENTS[id].b].push(id);
  }

  // ==================================================
  // SIMULATION
  // ==================================================
  // Which segment a train arriving at `nodeId` along `fromSeg` continues
  // onto, or null at the end of track. Arriving on a switch's trunk follows
  // the leg it is set to. Arriving on a leg returns to the trunk; if the
  // switch was set the other way the train trails through it and pushes it
  // over (a spring switch). Retunable: later this could derail instead.
  function nextSegment(nodeId, fromSeg) {
    const sw = SWITCHES[nodeId];
    if (sw) {
      if (fromSeg === sw.trunk) return state.switches[nodeId].set;
      state.switches[nodeId].set = fromSeg;
      return sw.trunk;
    }
    return SEGMENTS_AT[nodeId].find(id => id !== fromSeg) || null;
  }

  function stepLoco(loco, dt) {
    const target = loco.throttle * SPEED_PER_NOTCH;
    const rate = Math.abs(target) < Math.abs(loco.speed) || Math.sign(target) !== Math.sign(loco.speed)
      ? BRAKING : ACCELERATION;
    const dv = Math.max(-rate * dt, Math.min(rate * dt, target - loco.speed));
    loco.speed += dv;

    // Distance to travel this step, in the segment's own a→b sense.
    let move = loco.speed * dt * loco.facing;
    while (move !== 0) {
      const len = segmentLength(loco.segment);
      const s = loco.s + move;
      if (s >= 0 && s <= len) { loco.s = s; break; }
      const atB = s > len;
      const nodeId = atB ? SEGMENTS[loco.segment].b : SEGMENTS[loco.segment].a;
      const next = nextSegment(nodeId, loco.segment);
      if (!next) {                       // end of track: stop at the buffer
        loco.s = atB ? len : 0;
        loco.speed = 0; loco.throttle = 0;
        break;
      }
      const leftover = atB ? s - len : -s;
      const enterAtA = SEGMENTS[next].a === nodeId;
      // Keep the direction of travel: entering at `a` means moving +s.
      const oldTravel = atB ? 1 : -1, newTravel = enterAtA ? 1 : -1;
      loco.facing *= oldTravel * newTravel;
      loco.segment = next;
      loco.s = enterAtA ? 0 : segmentLength(next);
      move = leftover * newTravel;
    }
  }

  function step(dt) {
    for (const loco of state.locos) stepLoco(loco, dt);
  }

  // ==================================================
  // ACTIONS
  // ==================================================
  function changeThrottle(loco, delta) {
    loco.throttle = Math.max(-THROTTLE_NOTCHES, Math.min(THROTTLE_NOTCHES, loco.throttle + delta));
  }
  function stopLoco(loco) { loco.throttle = 0; }
  function throwSwitch(swId) {
    const sw = SWITCHES[swId], cur = state.switches[swId];
    cur.set = cur.set === sw.legs[0] ? sw.legs[1] : sw.legs[0];
  }

  // ==================================================
  // RENDERING
  // ==================================================
  const canvas = document.getElementById("yard");
  const ctx = canvas.getContext("2d");
  const readout = document.getElementById("readout");

  // World bounds, from WORLD DATA, once.
  const BOUNDS = (() => {
    const xs = Object.values(NODES).map(n => n.x), ys = Object.values(NODES).map(n => n.y);
    return { minX: Math.min(...xs) - VIEW_MARGIN, maxX: Math.max(...xs) + VIEW_MARGIN,
             minY: Math.min(...ys) - VIEW_MARGIN, maxY: Math.max(...ys) + VIEW_MARGIN };
  })();

  // The world→screen mapping for a canvas of w×h CSS px. A yard wider than
  // it is tall, on a screen taller than it is wide, is turned a quarter
  // anticlockwise: east runs up the screen and south runs right.
  function makeView(w, h) {
    const ww = BOUNDS.maxX - BOUNDS.minX, wh = BOUNDS.maxY - BOUNDS.minY;
    const turned = (h > w) === (ww > wh);
    const sw = turned ? wh : ww, sh = turned ? ww : wh;   // yard's extent on screen axes
    const k = Math.min(w / sw, h / sh);
    const ox = (w - sw * k) / 2, oy = (h - sh * k) / 2;
    return {
      k,
      toScreen: turned
        ? (x, y) => ({ x: ox + (y - BOUNDS.minY) * k, y: oy + (BOUNDS.maxX - x) * k })
        : (x, y) => ({ x: ox + (x - BOUNDS.minX) * k, y: oy + (y - BOUNDS.minY) * k }),
    };
  }
  let view = makeView(1, 1);

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    view = makeView(r.width, r.height);
  }
  new ResizeObserver(resize).observe(canvas);

  function line(x1, y1, x2, y2, colour, width) {
    const a = view.toScreen(x1, y1), b = view.toScreen(x2, y2);
    ctx.strokeStyle = colour; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  function render() {
    const k = view.k;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = "round";
    const trackWidth = Math.max(3, k);
    for (const id in SEGMENTS) {
      const { a, b } = SEGMENTS[id];
      line(NODES[a].x, NODES[a].y, NODES[b].x, NODES[b].y, "#6b6a64", trackWidth);
    }

    // Switches: the leg each is set to is drawn bright from the node out.
    for (const id in SWITCHES) {
      const n = NODES[id], set = state.switches[id].set;
      const far = pointOn(set, SEGMENTS[set].a === id ? 12 : segmentLength(set) - 12);
      line(n.x, n.y, far.x, far.y, "#e3c55a", trackWidth);
      const c = view.toScreen(n.x, n.y);
      ctx.fillStyle = "#e3c55a";
      ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(6, trackWidth * 1.4), 0, Math.PI * 2); ctx.fill();
    }

    for (const loco of state.locos) {
      const p = pointOn(loco.segment, loco.s);
      const c = view.toScreen(p.x, p.y);
      const ahead = view.toScreen(p.x + p.ux * loco.facing, p.y + p.uy * loco.facing);
      const len = LOCO_LENGTH * k, wid = Math.max(10, 3 * k);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(Math.atan2(ahead.y - c.y, ahead.x - c.x));
      ctx.fillStyle = "#c0533a";
      ctx.fillRect(-len / 2, -wid / 2, len, wid);
      ctx.fillStyle = "#f2e6d0";                          // cab end = front
      ctx.fillRect(len / 2 - wid * 0.7, -wid * 0.35, wid * 0.5, wid * 0.7);
      ctx.restore();
    }

    const loco = state.locos[0];
    readout.innerHTML = `Throttle ${loco.throttle > 0 ? "+" : ""}${loco.throttle} · ` +
      `${(Math.abs(loco.speed) * 3.6).toFixed(1)} km/h<small>v${GAME_CONFIG.VERSION}</small>`;
  }

  // ==================================================
  // INPUT / LOOP
  // ==================================================
  window.addEventListener("keydown", e => {
    const loco = state.locos[0];
    if (e.repeat) return;
    if (e.key === "w" || e.key === "ArrowUp") changeThrottle(loco, 1);
    else if (e.key === "s" || e.key === "ArrowDown") changeThrottle(loco, -1);
    else if (e.key === " ") stopLoco(loco);
    else return;
    e.preventDefault();
  });

  // pointerdown rather than click: it answers at once on touch screens.
  const onPress = (id, fn) => document.getElementById(id).addEventListener("pointerdown", e => {
    e.preventDefault(); fn(state.locos[0]);
  });
  onPress("backBtn", loco => changeThrottle(loco, -1));
  onPress("stopBtn", loco => stopLoco(loco));
  onPress("fwdBtn", loco => changeThrottle(loco, 1));

  // A tap throws the nearest switch within SWITCH_TAP_RADIUS_PX on screen.
  canvas.addEventListener("pointerdown", e => {
    const r = canvas.getBoundingClientRect();
    const tx = e.clientX - r.left, ty = e.clientY - r.top;
    let best = null, bestD = SWITCH_TAP_RADIUS_PX;
    for (const id in SWITCHES) {
      const c = view.toScreen(NODES[id].x, NODES[id].y);
      const d = Math.hypot(c.x - tx, c.y - ty);
      if (d < bestD) { best = id; bestD = d; }
    }
    if (best) throwSwitch(best);
  });

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, STEP_SECONDS * MAX_STEPS_PER_FRAME);
    last = now;
    while (acc >= STEP_SECONDS) { step(STEP_SECONDS); acc -= STEP_SECONDS; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Exposed for testing in a browser console or headless check.
  window.switching = { get state() { return state; }, step, throwSwitch, changeThrottle };
})();
</script>
</body>
</html>
