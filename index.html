<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d1f">
<title>Switching Game</title>
<style>
  :root { --bg: #1b1d1f; --ground: #2a2d2a; --fg: #d8d4cc; --muted: #8a867e; --line: #3a3d3a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, sans-serif; overscroll-behavior: none; }
  /* Phone held upright is the target. The yard fills the screen and the
     controls sit along the bottom, in thumb reach. The safe-area paddings
     keep both clear of notches and the home bar. */
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  #view { flex: 1; min-height: 0; position: relative; background: var(--ground); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #bar { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line);
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); }
  /* Zoom, then Pause a little apart from it, sit over the yard's top-left
     corner. */
  #zoom { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(38, 42, 48, 0.85); color: var(--fg); font: 600 20px system-ui, sans-serif; padding: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #zoom button:active { background: #343a42; }
  #zoom #followBtn { font-size: 16px; }
  #zoom #followBtn.on { color: #e3c55a; }
  #zoom #pauseBtn { margin-top: 8px; font-size: 16px; }
  #zoom #pauseBtn.on { color: #e3c55a; border-color: #e3c55a; }
  #readout { font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
  #readout small { color: var(--muted); font-size: 12px; align-self: center; }
  /* The reverser and three notched levers (throttle, loco brake, train
     brake), each an up and a down with its setting between them, then
     Release over Emergency. Buttons are 44 px tall, the smallest
     comfortable thumb target; retunable. */
  #controls { display: grid; grid-template-columns: repeat(5, minmax(48px, 1fr)); gap: 4px 8px;
    max-width: 420px; width: 100%; margin: 0 auto; }
  #controls button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line);
    background: #262a30; color: var(--fg); font: 600 18px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #controls button:active { background: #343a42; }
  #controls .word { font-size: 13px; }
  #controls #emergBtn { background: #6b2620; border-color: #8a3a30; }
  #controls #emergBtn:active { background: #84302a; }
  .lever { text-align: center; font-size: 11px; line-height: 1.25; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .lever b { display: block; color: var(--fg); font-size: 14px; }
  .meter { height: 3px; margin: 2px 6px 0; background: var(--line); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #e3c55a; }
  /* A phone on its side has little height to spare: the controls move to the
     right-hand edge instead. */
  @media (orientation: landscape) and (max-height: 520px) {
    body { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
    #bar { border-top: 0; border-left: 1px solid var(--line); justify-content: center;
      padding: 8px calc(12px + env(safe-area-inset-right)) 8px 12px; width: 360px; box-sizing: border-box; }
  }
</style>
</head>
<body>
<div id="view"><canvas id="yard"></canvas>
  <div id="zoom">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="followBtn" aria-label="Follow the loco">◎&#xFE0E;</button>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
</div>
<div id="bar">
  <div id="readout"></div>
  <div id="controls">
    <button id="revUp" aria-label="Reverser toward forward">▲&#xFE0E;</button>
    <button id="thrUp" aria-label="Throttle up">+</button>
    <button id="lbUp" aria-label="Loco brake on">+</button>
    <button id="tbUp" aria-label="Train brake on">+</button>
    <button id="releaseBtn" class="word">Release</button>
    <div class="lever" id="revLever"></div>
    <div class="lever" id="thrLever"></div>
    <div class="lever" id="lbLever"></div>
    <div class="lever" id="tbLever"></div>
    <div></div>
    <button id="revDown" aria-label="Reverser toward reverse">▼&#xFE0E;</button>
    <button id="thrDown" aria-label="Throttle down">−</button>
    <button id="lbDown" aria-label="Loco brake off">−</button>
    <button id="tbDown" aria-label="Train brake off">−</button>
    <button id="emergBtn" class="word">Emerg</button>
  </div>
</div>
<script>
"use strict";
(() => {
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // One self-contained file, no build step, no dependencies. Content and
  // mechanics are kept apart so a pass can touch one without the other.
  //
  //   CONFIG       version and every tunable game rule, as named constants.
  //   WORLD DATA   the yard: track nodes, straight or curved segments between
  //                them, switches;
  //                the kinds of rolling stock and where it starts.
  //                Content passes (a new siding, a new yard) touch only this.
  //   STATE        what changes while playing: switch positions, vehicles,
  //                the trains they are coupled into, the loco's controls.
  //                Built from WORLD DATA by makeState(); never edits WORLD DATA.
  //   UTILITIES    small geometry, track-walking and lookup helpers.
  //   SIMULATION   advances STATE by one fixed step, step(dt). All movement
  //                rules live here: forces, brakes, contact, coupling. The
  //                loop calls it at a fixed rate, so behaviour never depends
  //                on the display's frame rate.
  //   ACTIONS      what the player can do (reverser, levers, Emergency,
  //                Release, throw a switch, uncouple), and the rules on when
  //                they may. They change STATE; they never draw.
  //   PERSISTENCE  none yet. When saving arrives, SAVE_KEY changes with every
  //                change to the saved shape.
  //   RENDERING    draws STATE to the canvas and the controls, through a
  //                camera (zoom, follow or pan) that is display only. It
  //                never holds rules.
  //   INPUT / LOOP keyboard, buttons and taps to ACTIONS; the fixed-step loop,
  //                and Pause, which holds the loop's steps and the player's
  //                actions but not the camera.
  //
  // Coordinates are metres, +x along the yard, +y to its right; WORLD DATA
  // says where north is. They are the world's, not the screen's: RENDERING
  // fits the yard to the screen and, on a portrait screen, turns it a
  // quarter so the yard runs up the screen (see makeView()).
  // Physics is in SI units: metres, seconds, kilograms, newtons.
  //
  // A train is a list of coupled vehicles, ordered from its head to its tail,
  // with one speed (+ toward the head). A vehicle stands on the track at its
  // centre, with `dir` the segment sense (+1 toward `b`) that points toward
  // its train's head; a lone car or loco is a train of one.
  // Identity is an id string, never an array index.
  // ==================================================

  // ==================================================
  // CONFIG
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.4.0" };
  const STEP_SECONDS = 1 / 60;          // fixed simulation step
  const MAX_STEPS_PER_FRAME = 5;        // drop time rather than spiral after a stall
  const VIEW_MARGIN = 8;                // metres of ground kept around the yard
  const ZOOM_LEVELS = [1, 1.5, 2, 3, 4]; // × the whole-yard fit; retunable
  const DRAG_START_PX = 8;              // CSS px a press moves before it pans instead of tapping
  const TAP_RADIUS_PX = 32;             // CSS px from a switch or coupling that a tap counts; retunable (a fingertip)
  const GAUGE = 1.676;                  // m, Argentine broad gauge (Junín's)
  const TIE_SPACING = 0.65;             // m between tie centres; approximate
  const TIE_LENGTH = 2.75;              // m; approximate
  const TRACK_DETAIL_K = 4;             // px per metre at which track is drawn as rails and ties; retunable
  const SWITCH_DIM_LENGTH = 25;         // m of the unset leg faded past a switch; retunable
  const SWITCH_DIM_STEPS = 5;           // steps the fade is drawn in
  const G = 9.81;                       // m/s²

  // Locomotive pull, modelled on a GM G12 as run in Argentina. The reverser
  // sets its direction (cab end first is forward); each throttle notch gives
  // an equal share of the pull; above LOCO_POWER / LOCO_MAX_FORCE (about
  // 4.3 m/s) the engine's power limits it.
  const THROTTLE_NOTCHES = 4;           // retunable
  const LOCO_MAX_FORCE = 187e3;         // N at full notch; the G12's rated tractive effort
  const LOCO_POWER = 977e3 * 0.8;       // W at the rail: the G12's 977 kW engine less an estimated fifth lost on the way; retunable
  const LOCO_MAX_SPEED = 8;             // m/s (29 km/h); a yard limit, not the G12's own; pull fades to nothing over the last GOVERNOR_BAND
  const GOVERNOR_BAND = 1;              // m/s

  // Rolling resistance, as a share of weight. Tuned for a small yard: a car
  // cut loose at CUT_ROLL_SPEED rolls CUT_ROLL_DISTANCE before it stops.
  // Real freight cars roll about three times as far (a share near 0.002).
  const CUT_ROLL_SPEED = 10 / 3.6;      // m/s; retunable
  const CUT_ROLL_DISTANCE = 60;         // m; retunable
  const ROLLING_RESISTANCE = CUT_ROLL_SPEED ** 2 / (2 * CUT_ROLL_DISTANCE * G);
  const STARTING_RESISTANCE = 0.012;    // share of weight to get a standing vehicle moving; retunable

  // Brakes. Each is a notched lever; the force builds toward the lever's
  // setting at its rate, as a share of full per second.
  const LOCO_BRAKE_NOTCHES = 4;         // retunable
  const LOCO_BRAKE_RATIO = 0.15;        // full force as a share of the loco's weight; retunable
  const LOCO_BRAKE_RATE = 2;            // full in half a second
  const TRAIN_BRAKE_NOTCHES = 5;        // retunable
  const TRAIN_BRAKE_RATIO = 0.1;        // full force as a share of the whole train's weight; retunable
  const TRAIN_BRAKE_APPLY_RATE = 1 / 4; // full in 4 s; retunable
  const TRAIN_BRAKE_RELEASE_RATE = 1 / 5; // off in 5 s; retunable
  const EMERGENCY_RATE = 1;             // full train brake in 1 s; retunable

  // Contact. Ends meeting at or below COUPLE_MAX_SPEED couple; faster is a
  // hard hit: a jolt, and the two bounce apart by HARD_HIT_RESTITUTION.
  const COUPLE_MAX_SPEED = 5 / 3.6;     // m/s closing speed; retunable
  const HARD_HIT_RESTITUTION = 0.3;     // retunable
  const NOTICE_SECONDS = 2;             // how long a message stays up
  const EPS = 1e-6;                     // metres; positions this close are the same

  // ==================================================
  // WORLD DATA
  // ==================================================
  // The locomotive depot fan at Junín (Buenos Aires), on the San Martín
  // line, from OpenStreetMap: a lead off the yard's north side splits into
  // seven dead-end tracks and a spur to the turntable. The turntable does
  // not turn; its spur is a dead end. Source and method:
  // docs/reference/junin-yard.md.
  //
  // OSM gives which track leaves which switch, where the switches stand and
  // where the tracks end. Its lines are rough, so each track is laid again
  // as a curve then a straight from its switch, which follows the real
  // layout but not exactly; switches standing closer than 30 m were spaced
  // out. Curves are 150 m radius where they fit, tighter (down to 82 m)
  // where the switches stand too close for that. The approach is 110 m of
  // the yard track the lead leaves from, cut off at a buffer. Tracks are
  // numbered from the turntable side; the numbers are the game's, not the
  // railway's.
  //
  // The yard is turned 40° clockwise from the map, so its length lies along
  // x; NORTH is true north on these axes. Coordinates are metres from the
  // approach's end.
  //
  // Every segment runs from node `a` to node `b`: a straight line, or, with
  // `r`, a circular curve of radius |r| metres that bends right (r > 0) or
  // left (r < 0) on the way from a to b, with x to the right and y down.
  // Track joins smoothly: where segments meet, the curves are laid out so
  // the directions match. A switch sits on a node: `trunk` is the
  // single-track side, `legs` the two diverging routes, and `normal` the leg
  // it starts set to. A node with only one segment is the end of track, with
  // a buffer stop.
  const NORTH = { x: 0.643, y: -0.766 };  // unit vector: (sin 40°, −cos 40°)
  const NODES = {
    approachEnd:  { x: 0, y: 0 },
    leadStart:    { x: 103.49, y: 37.29 },
    leadBend:     { x: 180.28, y: 43.91 },
    J1:           { x: 227.19, y: 35.67 },
    J2:           { x: 255.28, y: 25.16 },
    J4:           { x: 342.6, y: 13.45 },
    t3Bend:       { x: 419.84, y: 14.64 },
    t3End:        { x: 459.32, y: 4.76 },
    t2End:        { x: 457.97, y: -5.48 },
    J5:           { x: 280.95, y: 9.62 },
    spurBend:     { x: 315.89, y: -19.64 },
    turntable:    { x: 328.17, y: -33.6 },
    t1Bend:       { x: 334.12, y: -10.06 },
    t1End:        { x: 457.73, y: -30.54 },
    J3:           { x: 286.32, y: 25.49 },
    J3J6Bend:     { x: 300.7, y: 23.73 },
    J6:           { x: 358.77, y: 19.43 },
    t4Bend:       { x: 363.76, y: 19.14 },
    t4End:        { x: 459.63, y: 15.26 },
    J6J7Bend:     { x: 395.11, y: 21.17 },
    J7:           { x: 404.18, y: 22.72 },
    t6Bend:       { x: 408.6, y: 23.4 },
    t6End:        { x: 460.39, y: 30.67 },
    t5Bend:       { x: 435.34, y: 24.74 },
    t5End:        { x: 460.23, y: 23.77 },
    t7Bend:       { x: 326.95, y: 24.09 },
    t7End:        { x: 461.59, y: 37.79 },
  };
  const SEGMENTS = {
    approach:           { a: "approachEnd", b: "leadStart" },
    leadCurve:          { a: "leadStart", b: "leadBend", r: -150 },
    lead:               { a: "leadBend", b: "J1" },
    J1J2:               { a: "J1", b: "J2", r: -81.9 },
    J2J4:               { a: "J2", b: "J4", r: 110.7 },
    track3Curve:        { a: "J4", b: "t3Bend", r: -150 },
    track3:             { a: "t3Bend", b: "t3End" },
    track2:             { a: "J4", b: "t2End", r: -137.7 },
    J2J5:               { a: "J2", b: "J5" },
    turntableSpurCurve: { a: "J5", b: "spurBend", r: -150 },
    turntableSpur:      { a: "spurBend", b: "turntable" },
    track1Curve:        { a: "J5", b: "t1Bend", r: 150 },
    track1:             { a: "t1Bend", b: "t1End" },
    J1J3:               { a: "J1", b: "J3" },
    J3J6Curve:          { a: "J3", b: "J3J6Bend", r: 150 },
    J3J6:               { a: "J3J6Bend", b: "J6" },
    track4Curve:        { a: "J6", b: "t4Bend", r: 150 },
    track4:             { a: "t4Bend", b: "t4End" },
    J6J7Curve:          { a: "J6", b: "J6J7Bend", r: 150 },
    J6J7:               { a: "J6J7Bend", b: "J7" },
    track6Curve:        { a: "J7", b: "t6Bend", r: -150 },
    track6:             { a: "t6Bend", b: "t6End" },
    track5Curve:        { a: "J7", b: "t5Bend", r: -150 },
    track5:             { a: "t5Bend", b: "t5End" },
    track7Curve:        { a: "J3", b: "t7Bend", r: 150 },
    track7:             { a: "t7Bend", b: "t7End" },
  };
  const SWITCHES = {
    J1: { trunk: "lead", legs: ["J1J3", "J1J2"], normal: "J1J3" },
    J2: { trunk: "J1J2", legs: ["J2J5", "J2J4"], normal: "J2J5" },
    J3: { trunk: "J1J3", legs: ["J3J6Curve", "track7Curve"], normal: "J3J6Curve" },
    J4: { trunk: "J2J4", legs: ["track3Curve", "track2"], normal: "track3Curve" },
    J5: { trunk: "J2J5", legs: ["turntableSpurCurve", "track1Curve"], normal: "track1Curve" },
    J6: { trunk: "J3J6", legs: ["track4Curve", "J6J7Curve"], normal: "track4Curve" },
    J7: { trunk: "J6J7", legs: ["track6Curve", "track5Curve"], normal: "track6Curve" },
  };

  // Kinds of rolling stock. Lengths are over the couplers.
  const VEHICLE_TYPES = {
    g12:       { loco: true,  length: 14, mass: 109e3, colour: "#c0533a" }, // GM G12; length approximate
    boxLoaded: { loco: false, length: 15, mass: 60e3, colour: "#7a5236" },
    boxEmpty:  { loco: false, length: 15, mass: 25e3, colour: "#a88a62" },
  };
  // Each starting train is laid out back from its head end, which stands `s`
  // metres along `segment` and faces `dir` (+1 toward the segment's `b`).
  // A loco's cab faces the head unless it has `flip: -1`.
  const START_TRAINS = [
    { segment: "approach", s: 60, dir: 1, vehicles: [{ id: "loco1", type: "g12" }] },
    { segment: "track1", s: 100, dir: 1, vehicles: [
      { id: "car1", type: "boxLoaded" }, { id: "car2", type: "boxLoaded" }, { id: "car3", type: "boxEmpty" }] },
    { segment: "track3", s: 36, dir: 1, vehicles: [
      { id: "car4", type: "boxEmpty" }, { id: "car5", type: "boxEmpty" }] },
    { segment: "track6", s: 48, dir: 1, vehicles: [
      { id: "car6", type: "boxLoaded" }, { id: "car7", type: "boxEmpty" }] },
    { segment: "track7", s: 120, dir: 1, vehicles: [{ id: "car8", type: "boxLoaded" }] },
  ];
  const PLAYER_LOCO = "loco1";

  // ==================================================
  // STATE
  // ==================================================
  function makeState() {
    const st = { switches: {}, vehicles: {}, trains: {}, nextTrain: 1, notice: null };
    for (const id in SWITCHES) st.switches[id] = { set: SWITCHES[id].normal };
    state = st;                           // walk() reads the switches as it lays trains out
    for (const t of START_TRAINS) {
      const train = { id: "t" + st.nextTrain++, vehicles: [], speed: 0 };
      let end = { seg: t.segment, s: t.s, travel: -t.dir };   // walking back from the head
      for (const v of t.vehicles) {
        const half = VEHICLE_TYPES[v.type].length / 2;
        const c = walk(end.seg, end.s, end.travel, half);
        const veh = { id: v.id, type: v.type, train: train.id, seg: c.seg, s: c.s, dir: -c.travel,
                      flip: v.flip || 1 };
        if (VEHICLE_TYPES[v.type].loco) veh.controls = { reverser: 0, throttle: 0, locoBrake: 0, trainBrake: 0,
          locoApplied: 0, trainApplied: 0, emergency: false };
        st.vehicles[v.id] = veh;
        train.vehicles.push(v.id);
        end = walk(c.seg, c.s, c.travel, half);
      }
      st.trains[train.id] = train;
    }
    for (const id in st.vehicles) trailSwitches(st.vehicles[id]);
    return st;
  }
  let state = null;                     // made once every helper exists, at the end of SIMULATION

  // ==================================================
  // UTILITIES
  // ==================================================
  // Each segment's shape, built once from WORLD DATA: its length along the
  // track and, for a curve, its centre, radius, the angle of `a` seen from
  // the centre, and `turn` (+1 bending right, -1 left).
  const SHAPES = {};
  for (const id in SEGMENTS) {
    const { a, b, r } = SEGMENTS[id], A = NODES[a], B = NODES[b];
    const dx = B.x - A.x, dy = B.y - A.y, chord = Math.hypot(dx, dy);
    if (!r) { SHAPES[id] = { length: chord }; continue; }
    const radius = Math.abs(r), turn = Math.sign(r), half = chord / 2;
    if (radius < half) console.warn(`Segment ${id}: radius ${radius} m is too tight for its ends`);
    // The centre stands off the chord's midpoint, to the side it bends toward.
    const off = Math.sqrt(Math.max(0, radius * radius - half * half)) * turn / chord;
    const cx = A.x + dx / 2 - dy * off, cy = A.y + dy / 2 + dx * off;
    SHAPES[id] = { length: radius * 2 * Math.asin(Math.min(1, half / radius)),
                   cx, cy, radius, turn, start: Math.atan2(A.y - cy, A.x - cx) };
  }
  const segmentLength = segId => SHAPES[segId].length;
  // The point `s` metres along a segment from its `a` end, and the unit
  // vector of the track's direction there, pointing toward `b`.
  function pointOn(segId, s) {
    const g = SHAPES[segId], A = NODES[SEGMENTS[segId].a];
    if (!g.radius) {
      const B = NODES[SEGMENTS[segId].b], ux = (B.x - A.x) / g.length, uy = (B.y - A.y) / g.length;
      return { x: A.x + ux * s, y: A.y + uy * s, ux, uy };
    }
    const angle = g.start + g.turn * s / g.radius, cos = Math.cos(angle), sin = Math.sin(angle);
    return { x: g.cx + g.radius * cos, y: g.cy + g.radius * sin, ux: -g.turn * sin, uy: g.turn * cos };
  }
  // Segments meeting at each node, built once from WORLD DATA.
  const SEGMENTS_AT = {};
  for (const id in NODES) SEGMENTS_AT[id] = [];
  for (const id in SEGMENTS) {
    SEGMENTS_AT[SEGMENTS[id].a].push(id);
    SEGMENTS_AT[SEGMENTS[id].b].push(id);
  }

  // Which segment track arriving at `nodeId` along `fromSeg` continues onto,
  // or null at the end of track. Arriving on a switch's trunk follows the leg
  // it is set to; arriving on a leg returns to the trunk. With `trail`,
  // arriving on a leg also sets the switch to it: a train trailing through a
  // switch set against it pushes it over (a spring switch). Retunable: later
  // this could derail instead.
  function routeFrom(nodeId, fromSeg, trail) {
    const sw = SWITCHES[nodeId];
    if (sw) {
      if (fromSeg === sw.trunk) return state.switches[nodeId].set;
      if (trail) state.switches[nodeId].set = fromSeg;
      return sw.trunk;
    }
    return SEGMENTS_AT[nodeId].find(id => id !== fromSeg) || null;
  }

  // Walks `dist` (≥ 0) metres along the track from `s` on `seg`, heading in
  // segment sense `travel`. Returns where it ends and the sense it is then
  // heading in; at the end of track it stops there with `short` the distance
  // it could not go. `nodes`, when given, collects the nodes it passes.
  function walk(seg, s, travel, dist, trail = false, nodes = null) {
    for (;;) {
      const len = segmentLength(seg), room = travel > 0 ? len - s : s;
      if (dist <= room) return { seg, s: s + travel * dist, travel, short: 0 };
      const nodeId = travel > 0 ? SEGMENTS[seg].b : SEGMENTS[seg].a;
      const next = routeFrom(nodeId, seg, trail);
      if (!next) return { seg, s: travel > 0 ? len : 0, travel, short: dist - room };
      if (nodes) nodes.push(nodeId);
      dist -= room;
      travel = SEGMENTS[next].a === nodeId ? 1 : -1;
      s = travel > 0 ? 0 : segmentLength(next);
      seg = next;
    }
  }

  const vehicleType = v => VEHICLE_TYPES[v.type];
  // A vehicle's two ends: `head` toward its train's head, `tail` away. Each
  // carries `travel`, the segment sense pointing outward from the vehicle.
  function vehicleEnds(v, trail = false, nodes = null) {
    const half = vehicleType(v).length / 2;
    return { head: walk(v.seg, v.s, v.dir, half, trail, nodes),
             tail: walk(v.seg, v.s, -v.dir, half, trail, nodes) };
  }
  function trainEnds(t) {
    return { head: vehicleEnds(state.vehicles[t.vehicles[0]]).head,
             tail: vehicleEnds(state.vehicles[t.vehicles[t.vehicles.length - 1]]).tail };
  }
  function trainMass(t) {
    let m = 0;
    for (const id of t.vehicles) m += vehicleType(state.vehicles[id]).mass;
    return m;
  }
  const playerLoco = () => state.vehicles[PLAYER_LOCO];
  const trainOf = v => state.trains[v.train];

  // ==================================================
  // SIMULATION
  // ==================================================
  // A vehicle's ends trail through switches as well as its centre, so a
  // switch is pushed over the moment a vehicle reaches it.
  function trailSwitches(v) { vehicleEnds(v, true); }

  // Flips a train end for end: same vehicles, same motion, head and tail
  // swapped.
  function reverseTrain(t) {
    t.vehicles.reverse();
    t.speed = -t.speed;
    for (const id of t.vehicles) { state.vehicles[id].dir *= -1; state.vehicles[id].flip *= -1; }
  }

  function setNotice(text) { state.notice = { text, time: NOTICE_SECONDS }; }

  // Moves each lever's brake force toward its setting.
  function stepBrakes(c, dt) {
    const approach = (cur, target, upRate, downRate) => target > cur
      ? Math.min(target, cur + upRate * dt) : Math.max(target, cur - downRate * dt);
    c.locoApplied = approach(c.locoApplied, c.locoBrake / LOCO_BRAKE_NOTCHES, LOCO_BRAKE_RATE, LOCO_BRAKE_RATE);
    c.trainApplied = approach(c.trainApplied, c.trainBrake / TRAIN_BRAKE_NOTCHES,
      c.emergency ? EMERGENCY_RATE : TRAIN_BRAKE_APPLY_RATE, TRAIN_BRAKE_RELEASE_RATE);
  }

  // Changes a train's speed by the forces on it: locos pull; rolling
  // resistance and brakes hold back, never more than it takes to stop.
  // Cars not coupled to a loco have no brakes: they are bled off and roll free.
  function accelerate(t, dt) {
    const mass = trainMass(t);
    let pull = 0, brake = 0;
    for (const id of t.vehicles) {
      const v = state.vehicles[id], c = v.controls;
      if (!c) continue;
      if (c.throttle && c.reverser) {
        const sense = c.reverser * v.flip;                        // toward the head, or not
        const along = t.speed * sense;                            // speed in the direction of pull
        const share = c.throttle / THROTTLE_NOTCHES;
        const force = Math.min(LOCO_MAX_FORCE, LOCO_POWER / Math.max(Math.abs(along), EPS));
        const governor = Math.max(0, Math.min(1, (LOCO_MAX_SPEED - along) / GOVERNOR_BAND));
        pull += sense * share * force * governor;
      }
      brake += c.locoApplied * LOCO_BRAKE_RATIO * vehicleType(v).mass * G;
      brake += c.trainApplied * TRAIN_BRAKE_RATIO * mass * G;
    }
    if (t.speed === 0) {
      // Standing: it stays put unless the pull beats brakes and starting resistance.
      if (Math.abs(pull) <= brake + STARTING_RESISTANCE * mass * G) return;
      t.speed = Math.sign(pull) * (Math.abs(pull) - brake - ROLLING_RESISTANCE * mass * G) / mass * dt;
      return;
    }
    const hold = brake + ROLLING_RESISTANCE * mass * G;
    const next = t.speed + (pull - Math.sign(t.speed) * hold) / mass * dt;
    t.speed = Math.sign(next) === Math.sign(t.speed) ? next : 0;
  }

  // The nearest thing ahead of a train end within `dist` metres: another
  // train's end facing it, or the end of track. null when the way is clear.
  // Looking ahead never pushes switches over.
  function findObstacle(end, dist, selfId) {
    const others = [];
    for (const id in state.trains) {
      if (id === selfId) continue;
      const e = trainEnds(state.trains[id]);
      others.push({ train: id, which: "head", ...e.head }, { train: id, which: "tail", ...e.tail });
    }
    let { seg, s, travel } = end, gone = 0;
    for (;;) {
      const len = segmentLength(seg), room = travel > 0 ? len - s : s;
      const reach = Math.min(room, dist - gone);
      let best = null;
      for (const o of others) {
        if (o.seg !== seg || o.travel !== -travel) continue;
        const d = (o.s - s) * travel;
        if (d >= -EPS && d <= reach + EPS && (!best || d < best.d)) best = { ...o, d };
      }
      if (best) return { kind: "train", train: best.train, which: best.which, gap: gone + Math.max(0, best.d) };
      if (dist - gone <= room) return null;
      gone += room;
      const nodeId = travel > 0 ? SEGMENTS[seg].b : SEGMENTS[seg].a;
      const next = routeFrom(nodeId, seg, false);
      if (!next) return { kind: "buffer", gap: gone };
      travel = SEGMENTS[next].a === nodeId ? 1 : -1;
      s = travel > 0 ? 0 : segmentLength(next);
      seg = next;
    }
  }

  // Moves every vehicle of a train `d` metres (+ toward its head).
  function moveTrain(t, d) {
    if (d === 0) return;
    const sense = Math.sign(d);
    for (const id of t.vehicles) {
      const v = state.vehicles[id];
      const p = walk(v.seg, v.s, v.dir * sense, Math.abs(d), true);
      v.seg = p.seg; v.s = p.s; v.dir = p.travel * sense;
    }
    for (const id of t.vehicles) trailSwitches(state.vehicles[id]);
  }

  // Train X's end `xEnd` has met train Y's end `yEnd`. Speeds are compared
  // along one axis, pointing from X into Y.
  function contact(X, xEnd, Y, yEnd) {
    const xs = xEnd === "head" ? 1 : -1, ys = yEnd === "head" ? -1 : 1;
    const uX = X.speed * xs, uY = Y.speed * ys, closing = uX - uY;
    if (closing <= 0) return;                                   // already parting
    const mX = trainMass(X), mY = trainMass(Y);
    const shared = (mX * uX + mY * uY) / (mX + mY);              // momentum is kept
    if (closing <= COUPLE_MAX_SPEED) {
      couple(X, xEnd, Y, yEnd, shared);
      return;
    }
    X.speed = (shared + HARD_HIT_RESTITUTION * (shared - uX)) * xs;
    Y.speed = (shared + HARD_HIT_RESTITUTION * (shared - uY)) * ys;
    setNotice(`Hard hit at ${(closing * 3.6).toFixed(0)} km/h`);
  }

  // Joins Y onto X. X's coupling end becomes its tail and Y's its head, so
  // the joined train runs X's vehicles then Y's. `shared` is the joined
  // speed along the X-into-Y axis, which then points away from the head.
  function couple(X, xEnd, Y, yEnd, shared) {
    if (xEnd === "head") reverseTrain(X);
    if (yEnd === "tail") reverseTrain(Y);
    for (const id of Y.vehicles) state.vehicles[id].train = X.id;
    X.vehicles = X.vehicles.concat(Y.vehicles);
    X.speed = -shared;
    delete state.trains[Y.id];
  }

  // Moves a train by its speed, stopping short at whatever it meets.
  function advance(t, dt) {
    const d = t.speed * dt;
    if (d === 0) return;
    const ends = trainEnds(t), lead = d > 0 ? "head" : "tail";
    const hit = findObstacle(ends[lead], Math.abs(d), t.id);
    if (!hit) { moveTrain(t, d); return; }
    moveTrain(t, Math.sign(d) * hit.gap);
    if (hit.kind === "train") { contact(t, lead, state.trains[hit.train], hit.which); return; }
    // A buffer stop: the train stops against it.
    if (Math.abs(t.speed) > COUPLE_MAX_SPEED) setNotice(`Hit the buffers at ${(Math.abs(t.speed) * 3.6).toFixed(0)} km/h`);
    t.speed = 0;
  }

  function step(dt) {
    for (const id in state.vehicles) if (state.vehicles[id].controls) stepBrakes(state.vehicles[id].controls, dt);
    for (const id in state.trains) accelerate(state.trains[id], dt);
    for (const id of Object.keys(state.trains)) if (state.trains[id]) advance(state.trains[id], dt);
    if (state.notice && (state.notice.time -= dt) <= 0) state.notice = null;
  }

  // Whether any vehicle stands over a node.
  function nodeOccupied(nodeId) {
    for (const id in state.vehicles) {
      const nodes = [];
      vehicleEnds(state.vehicles[id], false, nodes);
      if (nodes.includes(nodeId)) return true;
    }
    return false;
  }

  state = makeState();

  // ==================================================
  // ACTIONS
  // ==================================================
  const clampNotch = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  // The reverser: forward (+1), neutral (0) or reverse (−1), one position a
  // press. It moves only with the throttle shut and the train stopped.
  // Retunable: both rules are design choices.
  function moveReverser(delta) {
    const v = playerLoco(), c = v.controls;
    const next = clampNotch(c.reverser + delta, -1, 1);
    if (next === c.reverser) return false;
    if (c.throttle) { setNotice("Shut the throttle first"); return false; }
    if (trainOf(v).speed !== 0) { setNotice("Stop before moving the reverser"); return false; }
    c.reverser = next;
    return true;
  }
  // The throttle opens only with the reverser in forward or reverse.
  function moveThrottle(delta) {
    const c = playerLoco().controls;
    if (delta > 0 && !c.reverser) { setNotice("Reverser is in neutral"); return; }
    c.throttle = clampNotch(c.throttle + delta, 0, THROTTLE_NOTCHES);
  }
  function moveLocoBrake(delta) {
    const c = playerLoco().controls;
    c.locoBrake = clampNotch(c.locoBrake + delta, 0, LOCO_BRAKE_NOTCHES);
  }
  function moveTrainBrake(delta) {
    const c = playerLoco().controls;
    c.trainBrake = clampNotch(c.trainBrake + delta, 0, TRAIN_BRAKE_NOTCHES);
    c.emergency = false;
  }
  // Emergency: power off, both brakes full, the train brake at its fastest.
  function emergency() {
    const c = playerLoco().controls;
    c.throttle = 0; c.locoBrake = LOCO_BRAKE_NOTCHES; c.trainBrake = TRAIN_BRAKE_NOTCHES; c.emergency = true;
  }
  // Release: both brake levers off.
  function release() {
    const c = playerLoco().controls;
    c.locoBrake = 0; c.trainBrake = 0; c.emergency = false;
  }
  // A switch with a vehicle over it cannot be thrown.
  function throwSwitch(swId) {
    if (nodeOccupied(swId)) { setNotice("A train is on that switch"); return false; }
    const sw = SWITCHES[swId], cur = state.switches[swId];
    cur.set = cur.set === sw.legs[0] ? sw.legs[1] : sw.legs[0];
    return true;
  }
  // Uncouples a train behind its vehicle `vehicleId`. Both parts keep moving;
  // the part without the loco has no brakes.
  function uncouple(vehicleId) {
    const v = state.vehicles[vehicleId], t = trainOf(v), i = t.vehicles.indexOf(vehicleId);
    if (i < 0 || i === t.vehicles.length - 1) return false;
    const rest = { id: "t" + state.nextTrain++, vehicles: t.vehicles.slice(i + 1), speed: t.speed };
    t.vehicles = t.vehicles.slice(0, i + 1);
    for (const id of rest.vehicles) state.vehicles[id].train = rest.id;
    state.trains[rest.id] = rest;
    return true;
  }

  // ==================================================
  // RENDERING
  // ==================================================
  const canvas = document.getElementById("yard");
  const ctx = canvas.getContext("2d");
  const readout = document.getElementById("readout");
  const followBtn = document.getElementById("followBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const levers = { rev: document.getElementById("revLever"), thr: document.getElementById("thrLever"), lb: document.getElementById("lbLever"),
                   tb: document.getElementById("tbLever") };

  // Points every few metres along a stretch of a segment, from `s0` to `s1`,
  // for drawing it. A straight needs only its ends.
  function trackPoints(segId, s0, s1) {
    const n = SHAPES[segId].radius ? Math.max(1, Math.ceil(Math.abs(s1 - s0) / 2)) : 1, out = [];
    for (let i = 0; i <= n; i++) out.push(pointOn(segId, s0 + (s1 - s0) * i / n));
    return out;
  }

  // World bounds, from WORLD DATA, once. Curves can bow out past their nodes.
  const BOUNDS = (() => {
    const pts = Object.keys(SEGMENTS).flatMap(id => trackPoints(id, 0, segmentLength(id)));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    return { minX: Math.min(...xs) - VIEW_MARGIN, maxX: Math.max(...xs) + VIEW_MARGIN,
             minY: Math.min(...ys) - VIEW_MARGIN, maxY: Math.max(...ys) + VIEW_MARGIN };
  })();

  // What the screen shows. Zoomed out it fits the whole yard; zoomed in it
  // follows the player's loco until a drag pans it to (cx, cy).
  const camera = { zoom: 0, follow: true, cx: 0, cy: 0 };

  // The world→screen mapping for a canvas of w×h CSS px. A yard wider than
  // it is tall, on a screen taller than it is wide, is turned a quarter
  // anticlockwise: +x runs up the screen and +y runs right. The view
  // centres on the camera's point, kept so the yard never leaves the screen.
  function makeView(w, h) {
    const ww = BOUNDS.maxX - BOUNDS.minX, wh = BOUNDS.maxY - BOUNDS.minY;
    const turned = (h > w) === (ww > wh);
    const sw = turned ? wh : ww, sh = turned ? ww : wh;   // yard's extent on screen axes
    const k = Math.min(w / sw, h / sh) * ZOOM_LEVELS[camera.zoom];
    let cx = camera.cx, cy = camera.cy;
    if (camera.follow) { const p = pointOn(playerLoco().seg, playerLoco().s); cx = p.x; cy = p.y; }
    const fit = (c, lo, hi, seen) => hi - lo <= seen ? (lo + hi) / 2 : Math.max(lo + seen / 2, Math.min(hi - seen / 2, c));
    cx = fit(cx, BOUNDS.minX, BOUNDS.maxX, (turned ? h : w) / k);
    cy = fit(cy, BOUNDS.minY, BOUNDS.maxY, (turned ? w : h) / k);
    return {
      k, turned, cx, cy,
      toScreen: turned
        ? (x, y) => ({ x: w / 2 + (y - cy) * k, y: h / 2 - (x - cx) * k })
        : (x, y) => ({ x: w / 2 + (x - cx) * k, y: h / 2 + (y - cy) * k }),
    };
  }
  let screenW = 1, screenH = 1, view = makeView(1, 1);

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    screenW = r.width; screenH = r.height;
  }
  new ResizeObserver(resize).observe(canvas);

  function line(x1, y1, x2, y2, colour, width) {
    const a = view.toScreen(x1, y1), b = view.toScreen(x2, y2);
    ctx.strokeStyle = colour; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function polyline(points, colour, width) {
    ctx.strokeStyle = colour; ctx.lineWidth = width;
    ctx.beginPath();
    points.forEach((p, i) => { const c = view.toScreen(p.x, p.y); i ? ctx.lineTo(c.x, c.y) : ctx.moveTo(c.x, c.y); });
    ctx.stroke();
  }
  const endPoint = e => pointOn(e.seg, e.s);
  // A point `d` metres from `p` toward `q`.
  function toward(p, q, d) {
    const len = Math.hypot(q.x - p.x, q.y - p.y) || 1;
    return { x: p.x + (q.x - p.x) * d / len, y: p.y + (q.y - p.y) * d / len };
  }
  // Where each coupling is: the joint behind every vehicle but a train's last.
  function couplings() {
    const out = [];
    for (const id in state.trains) {
      const t = state.trains[id];
      for (let i = 0; i < t.vehicles.length - 1; i++) {
        const v = state.vehicles[t.vehicles[i]];
        out.push({ vehicle: v.id, at: endPoint(vehicleEnds(v).tail) });
      }
    }
    return out;
  }

  function render() {
    view = makeView(screenW, screenH);
    const k = view.k;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = "round";
    const trackWidth = Math.max(3, k);
    const detailed = k >= TRACK_DETAIL_K;
    // A stretch of track, `s0` to `s1` along segment `id`: zoomed out a
    // single line; zoomed in two rails on ties.
    function drawTrack(id, s0, s1, alpha) {
      const pts = trackPoints(id, s0, s1);
      ctx.globalAlpha = alpha;
      if (!detailed) { polyline(pts, "#6b6a64", trackWidth); ctx.globalAlpha = 1; return; }
      const half = GAUGE / 2, len = Math.abs(s1 - s0), dir = Math.sign(s1 - s0) || 1;
      ctx.lineCap = "butt";
      ctx.strokeStyle = "#4a4239"; ctx.lineWidth = Math.max(1.5, k * 0.25);  // ties, in one path
      ctx.beginPath();
      for (let d = TIE_SPACING / 2; d < len; d += TIE_SPACING) {
        const p = pointOn(id, s0 + dir * d), h = TIE_LENGTH / 2;
        const e1 = view.toScreen(p.x - p.uy * h, p.y + p.ux * h), e2 = view.toScreen(p.x + p.uy * h, p.y - p.ux * h);
        ctx.moveTo(e1.x, e1.y); ctx.lineTo(e2.x, e2.y);
      }
      ctx.stroke();
      for (const side of [-1, 1])                                        // rails
        polyline(pts.map(p => ({ x: p.x - p.uy * half * side, y: p.y + p.ux * half * side })), "#a9a59c", Math.max(1.2, k * 0.12));
      ctx.lineCap = "round";
      ctx.globalAlpha = 1;
    }
    // The leg a switch is not set to fades in from the switch, so the route
    // through the points reads at a glance.
    const dimmed = {};
    for (const id in SWITCHES) for (const leg of SWITCHES[id].legs)
      if (leg !== state.switches[id].set) (dimmed[leg] = dimmed[leg] || []).push(SEGMENTS[leg].a === id ? "a" : "b");
    // Faded stretches go down first, so the set route draws over them where
    // the legs still overlap. They fade in from the switch in a few steps.
    const solid = [];
    for (const id in SEGMENTS) {
      const len = segmentLength(id), ends = dimmed[id] || [], reach = Math.min(SWITCH_DIM_LENGTH, len / 2);
      const s0 = ends.includes("a") ? reach : 0, s1 = ends.includes("b") ? len - reach : len;
      solid.push([id, s0, s1]);
      for (let i = 0; i < SWITCH_DIM_STEPS; i++) {
        const f0 = i / SWITCH_DIM_STEPS, f1 = (i + 1) / SWITCH_DIM_STEPS, alpha = 0.3 + 0.7 * f0;
        if (s0 > 0) drawTrack(id, s0 * f0, s0 * f1, alpha);
        if (s1 < len) drawTrack(id, len - (len - s1) * f0, len - (len - s1) * f1, alpha);
      }
    }
    for (const [id, s0, s1] of solid) drawTrack(id, s0, s1, 1);
    // Buffer stops at every end of track.
    for (const id in NODES) {
      if (SEGMENTS_AT[id].length !== 1) continue;
      const seg = SEGMENTS_AT[id][0], p = pointOn(seg, SEGMENTS[seg].a === id ? 0 : segmentLength(seg));
      line(p.x - p.uy * 2, p.y + p.ux * 2, p.x + p.uy * 2, p.y - p.ux * 2, "#b9b2a4", Math.max(3, k * 0.8));
    }

    // Switch targets, after FA practice (RGF art. 100): a green disc when the
    // switch is set normal, a yellow triangle on black when it is reversed,
    // pointing along the leg it is set to.
    for (const id in SWITCHES) {
      const n = NODES[id], set = state.switches[id].set, normal = set === SWITCHES[id].normal;
      const len = segmentLength(set), atA = SEGMENTS[set].a === id;
      const c = view.toScreen(n.x, n.y), r = Math.max(6, k * 1.6);
      const ahead = pointOn(set, atA ? Math.min(6, len) : len - Math.min(6, len)), q = view.toScreen(ahead.x, ahead.y);
      const dl = Math.hypot(q.x - c.x, q.y - c.y) || 1, ux = (q.x - c.x) / dl, uy = (q.y - c.y) / dl;
      ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
      ctx.beginPath();
      if (normal) { ctx.fillStyle = "#3fae5a"; ctx.arc(c.x, c.y, r * 0.8, 0, Math.PI * 2); }
      else {
        ctx.fillStyle = "#f0c419";
        ctx.moveTo(c.x + ux * r * 1.2, c.y + uy * r * 1.2);
        ctx.lineTo(c.x - ux * r * 0.7 - uy * r, c.y - uy * r * 0.7 + ux * r);
        ctx.lineTo(c.x - ux * r * 0.7 + uy * r, c.y - uy * r * 0.7 - ux * r);
        ctx.closePath();
      }
      ctx.stroke(); ctx.fill();
    }

    // Vehicles, each drawn end to end with a small gap; couplings bridge it.
    const bodyWidth = Math.max(10, 3 * k), inset = 0.5;
    ctx.lineCap = "butt";
    for (const id in state.vehicles) {
      const v = state.vehicles[id], type = vehicleType(v), e = vehicleEnds(v);
      const head = endPoint(e.head), tail = endPoint(e.tail);
      const front = toward(head, tail, inset), back = toward(tail, head, inset);
      line(back.x, back.y, front.x, front.y, type.colour, bodyWidth);
      if (type.loco) {                                    // cab, at the end it faces
        const cabEnd = v.flip > 0 ? front : back, other = v.flip > 0 ? back : front;
        const c1 = toward(cabEnd, other, 0.6), c2 = toward(cabEnd, other, 3);
        line(c1.x, c1.y, c2.x, c2.y, "#f2e6d0", bodyWidth * 0.6);
      }
      if (v.controls && v.controls.reverser) {            // arrow off the end the reverser points to
        const toHead = v.controls.reverser * v.flip > 0;
        const pe = toHead ? head : tail, po = toHead ? tail : head;
        const e = view.toScreen(pe.x, pe.y), o = view.toScreen(po.x, po.y);
        const len = Math.hypot(e.x - o.x, e.y - o.y) || 1, ux = (e.x - o.x) / len, uy = (e.y - o.y) / len;
        const size = Math.max(7, k * 1.5), bx = e.x + ux * size * 0.4, by = e.y + uy * size * 0.4;
        ctx.fillStyle = "#e3c55a";
        ctx.beginPath();
        ctx.moveTo(bx + ux * size * 1.2, by + uy * size * 1.2);
        ctx.lineTo(bx - uy * size * 0.8, by + ux * size * 0.8);
        ctx.lineTo(bx + uy * size * 0.8, by - ux * size * 0.8);
        ctx.fill();
      }
    }
    for (const c of couplings()) {
      const p = view.toScreen(c.at.x, c.at.y);
      ctx.fillStyle = "#1b1d1f";
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2.5, k * 0.5), 0, Math.PI * 2); ctx.fill();
    }

    // North arrow in the top right corner, turned with the view.
    {
      const o = view.toScreen(0, 0), n = view.toScreen(NORTH.x, NORTH.y);
      const len = Math.hypot(n.x - o.x, n.y - o.y) || 1, ux = (n.x - o.x) / len, uy = (n.y - o.y) / len;
      const cx = screenW - 26, cy = 34, size = 10;
      ctx.fillStyle = "#d8d4cc"; ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(cx + ux * size, cy + uy * size);
      ctx.lineTo(cx - ux * size * 0.6 - uy * size * 0.5, cy - uy * size * 0.6 + ux * size * 0.5);
      ctx.lineTo(cx - ux * size * 0.3, cy - uy * size * 0.3);
      ctx.lineTo(cx - ux * size * 0.6 + uy * size * 0.5, cy - uy * size * 0.6 - ux * size * 0.5);
      ctx.fill();
      ctx.font = "600 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("N", cx + ux * size * 2, cy + uy * size * 2);
      ctx.globalAlpha = 1; ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
    }

    if (state.notice) {
      ctx.globalAlpha = Math.min(1, state.notice.time);
      ctx.font = "600 15px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#f2e6d0";
      ctx.fillText(state.notice.text, screenW / 2, 24);
      ctx.globalAlpha = 1; ctx.textAlign = "start";
    }
    if (paused) {
      ctx.font = "600 22px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#e3c55a";
      ctx.fillText("Paused", screenW / 2, screenH / 2);
      ctx.textAlign = "start";
    }

    const loco = playerLoco(), c = loco.controls, t = trainOf(loco);
    const cars = t.vehicles.length - 1;
    readout.innerHTML = `<span>${(Math.abs(t.speed) * 3.6).toFixed(1)} km/h · ` +
      `${cars} car${cars === 1 ? "" : "s"}</span><small>v${GAME_CONFIG.VERSION}</small>`;
    followBtn.classList.toggle("on", camera.follow);
    pauseBtn.classList.toggle("on", paused);
    pauseBtn.innerHTML = paused ? "▶&#xFE0E;" : "❚❚";
    pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
    levers.rev.innerHTML = `Reverser<b>${c.reverser > 0 ? "Fwd" : c.reverser < 0 ? "Rev" : "N"}</b>`;
    levers.thr.innerHTML = `Throttle<b>${c.throttle}/${THROTTLE_NOTCHES}</b>`;
    levers.lb.innerHTML = `Loco brake<b>${c.locoBrake}/${LOCO_BRAKE_NOTCHES}</b>` +
      `<div class="meter"><i style="width:${c.locoApplied * 100}%"></i></div>`;
    levers.tb.innerHTML = `Train brake<b>${c.emergency ? "EMERG" : c.trainBrake + "/" + TRAIN_BRAKE_NOTCHES}</b>` +
      `<div class="meter"><i style="width:${c.trainApplied * 100}%"></i></div>`;
  }

  // ==================================================
  // INPUT / LOOP
  // ==================================================
  // Pause holds the simulation step and every player action; zoom, follow
  // and pan still work, so the yard can be looked over while it is held.
  let paused = false;
  const togglePause = () => { paused = !paused; };
  const unlessPaused = fn => (...args) => { if (!paused) fn(...args); };
  // Leaving the page (another app, a call, a locked screen) pauses it, so
  // the game waits for the player to resume; retunable.
  document.addEventListener("visibilitychange", () => { if (document.hidden) paused = true; });

  // Keyboard: +/− zoom, P pause, Q/A reverser, W/S or ↑/↓ throttle, R/F loco brake,
  // E/D train brake, Space emergency, X release.
  const KEYS = {
    q: () => moveReverser(1), a: () => moveReverser(-1),
    w: () => moveThrottle(1), ArrowUp: () => moveThrottle(1),
    s: () => moveThrottle(-1), ArrowDown: () => moveThrottle(-1),
    r: () => moveLocoBrake(1), f: () => moveLocoBrake(-1),
    e: () => moveTrainBrake(1), d: () => moveTrainBrake(-1),
    " ": emergency, x: release,
  };
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    if (VIEW_KEYS[e.key]) VIEW_KEYS[e.key]();
    else if (KEYS[e.key]) unlessPaused(KEYS[e.key])();
    else return;
    e.preventDefault();
  });

  // pointerdown rather than click: it answers at once on touch screens.
  const onPress = (id, fn) => document.getElementById(id).addEventListener("pointerdown", e => {
    e.preventDefault(); unlessPaused(fn)();
  });
  onPress("revUp", () => moveReverser(1));
  onPress("revDown", () => moveReverser(-1));
  onPress("thrUp", () => moveThrottle(1));
  onPress("thrDown", () => moveThrottle(-1));
  onPress("lbUp", () => moveLocoBrake(1));
  onPress("lbDown", () => moveLocoBrake(-1));
  onPress("tbUp", () => moveTrainBrake(1));
  onPress("tbDown", () => moveTrainBrake(-1));
  onPress("releaseBtn", release);
  onPress("emergBtn", emergency);

  // Zoom steps through ZOOM_LEVELS; zooming in follows the loco again.
  function zoomBy(delta) {
    camera.zoom = clampNotch(camera.zoom + delta, 0, ZOOM_LEVELS.length - 1);
    if (delta > 0 && camera.zoom === 1) camera.follow = true;
  }
  const onViewPress = (id, fn) => document.getElementById(id).addEventListener("pointerdown", e => {
    e.preventDefault(); fn();
  });
  onViewPress("zoomIn", () => zoomBy(1));
  onViewPress("zoomOut", () => zoomBy(-1));
  onViewPress("followBtn", () => { camera.follow = true; });
  onViewPress("pauseBtn", togglePause);
  const VIEW_KEYS = { "+": () => zoomBy(1), "=": () => zoomBy(1), "-": () => zoomBy(-1), p: togglePause };

  // A press on the yard that moves more than DRAG_START_PX pans it; one that
  // doesn't is a tap, acted on when it lifts.
  let press = null;
  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, dragging: false, cx: view.cx, cy: view.cy };
  });
  canvas.addEventListener("pointermove", e => {
    if (!press || e.pointerId !== press.id) return;
    const dx = e.clientX - press.x, dy = e.clientY - press.y;
    if (!press.dragging && Math.hypot(dx, dy) < DRAG_START_PX) return;
    press.dragging = true;
    camera.follow = false;
    // Screen motion back into world metres, undoing makeView's turn.
    camera.cx = press.cx - (view.turned ? -dy : dx) / view.k;
    camera.cy = press.cy - (view.turned ? dx : dy) / view.k;
  });
  canvas.addEventListener("pointercancel", () => { press = null; });
  canvas.addEventListener("pointerup", e => {
    if (!press || e.pointerId !== press.id) return;
    const tapped = !press.dragging;
    press = null;
    if (tapped) tap(e);
  });

  // A tap acts on the nearest switch (throws it) or coupling (uncouples it)
  // within TAP_RADIUS_PX on screen.
  function tap(e) {
    const r = canvas.getBoundingClientRect();
    const tx = e.clientX - r.left, ty = e.clientY - r.top;
    let best = null, bestD = TAP_RADIUS_PX;
    const consider = (x, y, act) => {
      const c = view.toScreen(x, y), d = Math.hypot(c.x - tx, c.y - ty);
      if (d < bestD) { best = act; bestD = d; }
    };
    for (const id in SWITCHES) consider(NODES[id].x, NODES[id].y, () => throwSwitch(id));
    for (const c of couplings()) consider(c.at.x, c.at.y, () => uncouple(c.vehicle));
    if (best) unlessPaused(best)();
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc = paused ? 0 : acc + Math.min((now - last) / 1000, STEP_SECONDS * MAX_STEPS_PER_FRAME);
    last = now;
    while (acc >= STEP_SECONDS) { step(STEP_SECONDS); acc -= STEP_SECONDS; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Exposed for testing in a browser console or headless check.
  window.switching = { get state() { return state; }, step, throwSwitch, uncouple, moveReverser, moveThrottle,
    moveLocoBrake, moveTrainBrake, emergency, release, trainEnds,
    get paused() { return paused; }, togglePause, CONFIG: { ROLLING_RESISTANCE } };
})();
</script>
</body>
</html>
