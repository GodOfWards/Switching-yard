<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Switching Game</title>
<style>
  /* Dark palette: the yard and the bar sit on black. Cool greys for chrome,
     one amber accent for anything on or active, red only for Emergency;
     retunable. */
  :root { --bg: #000; --ground: #000; --fg: #ecebe7; --muted: #7a7b80; --line: #26272b;
    --button: #111214; --button-down: #1f2125; --overlay: rgba(17, 18, 20, 0.78);
    --accent: #f2b13c; --warn: #f0905a; --sheet: #121316; --danger: #ff6b6b; --danger-bg: #2a0f10; --danger-line: #5c1d1f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, sans-serif; overscroll-behavior: none; }
  /* Phone held upright is the target. The yard fills the screen and the
     controls sit along the bottom, in thumb reach. The safe-area paddings
     keep both clear of notches and the home bar. */
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  #view { flex: 1; min-height: 0; position: relative; background: var(--ground); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #bar { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line);
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); }
  /* Zoom, then Pause and New yard, each a little apart, sit over the
     yard's top-left corner. */
  #zoom { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--fg); font: 500 18px system-ui, sans-serif; padding: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #zoom button:active { background: var(--button-down); }
  #zoom #followBtn { font-size: 14px; }
  #zoom #followBtn.on { color: var(--accent); }
  #zoom #pauseBtn { margin-top: 8px; font-size: 14px; }
  #zoom #pauseBtn.on { color: var(--accent); border-color: var(--accent); }
  #zoom #newYardBtn { margin-top: 8px; font-size: 16px; }
  /* The clock, then Skip, across the top of the yard between the zoom
     buttons and the north arrow; Skip's menu opens beneath them. */
  #clockBar { position: absolute; top: 8px; left: 52px; right: 52px; display: flex; justify-content: center; gap: 6px; }
  #clock { display: flex; align-items: baseline; gap: 8px; min-width: 0; height: 40px; box-sizing: border-box;
    padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--overlay);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); line-height: 38px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #clock b { font-size: 18px; font-weight: 600; }
  #clock span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  #skipBtn, #skipMenu button { border-radius: 11px; border: 1px solid var(--line); color: var(--fg);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #skipBtn { flex: none; height: 40px; padding: 0 14px; background: var(--overlay);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font: 600 14px system-ui, sans-serif; }
  #skipBtn:active, #skipMenu button:active { background: var(--button-down); }
  #skipBtn.on { color: var(--accent); border-color: var(--accent); }
  #skipMenu { position: absolute; display: none; top: 56px; left: 50%; transform: translateX(-50%);
    width: min(360px, calc(100% - 16px)); max-height: calc(100% - 64px); overflow-y: auto; box-sizing: border-box;
    padding: 4px 12px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--overlay);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
  #skipMenu.open { display: block; }
  #skipMenu h3 { margin: 10px 0 6px; color: var(--muted); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; }
  #skipMenu .event { display: flex; gap: 12px; align-items: baseline; width: 100%; min-height: 44px;
    padding: 0 10px; border-color: transparent; background: none; font: 15px system-ui, sans-serif; text-align: left; }
  #skipMenu .event b { font-weight: 600; }
  #skipMenu .event { padding-top: 6px; padding-bottom: 6px; }
  #skipMenu .event small { color: var(--muted); font-size: 12px; }
  #skipMenu .event span small { display: block; }
  #skipMenu .marks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #skipMenu .marks button { min-height: 40px; background: var(--button); font: 600 15px system-ui, sans-serif; }
  #skipMenu .warn, #skipMenu .event small.warn { color: var(--warn); }
  #skipMenu .marks button.warn { color: var(--warn); }
  #skipMenu .note { margin: 8px 2px 0; color: var(--warn); font-size: 12px; }
  /* A job being worked: a chip under the clock with its progress, which
     opens its sheet. The Jobs button sits in the yard's bottom-right corner;
     the board and the job sheet slide up from the bottom of the yard and
     stop above the controls. */
  #jobChip { position: absolute; display: none; top: 54px; left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 112px); height: 32px; padding: 0 12px; box-sizing: border-box; border-radius: 16px;
    border: 1px solid var(--line); background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--fg); font: 13px system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #jobChip.open { display: block; }
  #jobChip em { font-style: normal; font-weight: 600; color: var(--accent); }
  #jobsBtn { position: absolute; right: 8px; bottom: 8px; min-height: 44px; padding: 0 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--fg); font: 600 15px system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #jobsBtn.on { color: var(--accent); border-color: var(--accent); }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: calc(100% - 52px);
    overflow-y: auto; box-sizing: border-box; padding: 0 16px 16px; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0; background: var(--sheet); transform: translateY(100%); visibility: hidden;
    transition: transform 0.2s ease, visibility 0.2s; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
  #sheet.open { transform: none; visibility: visible; }
  #sheet .grab { width: 40px; height: 4px; margin: 8px auto 4px; border-radius: 2px; background: var(--line); }
  #sheet header { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
  #sheet h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
  #sheet header [data-act="board"] { font-size: 24px; }
  #sheet header button { min-width: 40px; min-height: 40px; padding: 0 8px; border: 0; background: none; color: var(--muted);
    font: 15px system-ui, sans-serif; }
  #sheet .job { display: flex; align-items: center; gap: 12px; margin: 8px 0; padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--line); }
  #sheet .job > div { flex: 1; min-width: 0; }
  #sheet .job b { display: block; font-weight: 600; }
  #sheet small { display: block; color: var(--muted); font-size: 13px; }
  #sheet .later { opacity: 0.5; }
  #sheet button.act { flex: none; min-width: 88px; min-height: 44px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--button); color: var(--fg); font: 600 15px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #sheet button.act:active { background: var(--button-down); }
  #sheet button.primary { color: var(--accent); border-color: var(--accent); }
  #sheet h3 { display: flex; justify-content: space-between; margin: 16px 0 4px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  #sheet h3 span:last-child { color: var(--accent); }
  #sheet .meta { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 14px; }
  #sheet .meta span:nth-child(odd) { color: var(--muted); }
  #sheet .remarks { margin: 6px 0 0; font-size: 14px; }
  #sheet .remarks span { color: var(--muted); }
  #sheet .line { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  #sheet h3 + .line { border-top: 0; }
  #sheet .line > div:nth-child(2) { flex: 1; min-width: 0; }
  #sheet .line .where { text-align: right; }
  #sheet .line.met:not(.order) b { text-decoration: line-through; color: var(--muted); }
  #sheet .tick { flex: none; width: 22px; height: 22px; margin-top: 1px; box-sizing: border-box; border-radius: 6px;
    border: 1.5px solid var(--muted); color: #000; font: 700 14px/19px system-ui, sans-serif; text-align: center; }
  #sheet .met .tick { border-color: var(--accent); background: var(--accent); }
  #sheet .warn { color: var(--warn); }
  #sheet .buttons { display: flex; gap: 8px; margin-top: 16px; }
  #sheet .buttons button { flex: 1; }
  #sheet .result { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); }
  #sheet .result b { display: block; font-size: 16px; color: var(--accent); }
  #readout { font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
  #readout small { color: var(--muted); font-size: 12px; align-self: center; }
  /* The reverser and three notched levers (throttle, loco brake, train
     brake), each an up and a down with its setting between them, then
     Release over Emergency. Buttons are 40 px tall, 10% under the usual
     44 px thumb target, at Tom's call; retunable. */
  #controls { display: grid; grid-template-columns: repeat(5, minmax(48px, 1fr)); gap: 4px 8px;
    max-width: 420px; width: 100%; margin: 0 auto; }
  #controls button { min-height: 40px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--button); color: var(--fg); font: 500 16px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #controls button:active { background: var(--button-down); }
  #controls .word { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  #controls #emergBtn { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
  #controls #emergBtn:active { background: var(--danger-line); }
  .lever { text-align: center; font-size: 11px; line-height: 1.3; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lever b { display: block; color: var(--fg); font-size: 15px; font-weight: 600; }
  .meter { height: 3px; margin: 2px 6px 0; background: var(--line); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  /* The coupling menu: two thumb-sized buttons over the yard, next to the
     coupling tapped. */
  #couplingMenu { position: absolute; display: none; gap: 6px; }
  #couplingMenu.open { display: flex; }
  #couplingMenu button { min-width: 80px; min-height: 40px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--fg); font: 600 13px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #couplingMenu button:active { background: var(--button-down); }
  /* The car card: what is stencilled on a tapped car, and its hand brake,
     next to the car. */
  #carCard { position: absolute; display: none; min-width: 180px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: 13px; line-height: 1.35; font-variant-numeric: tabular-nums; }
  #carCard.open { display: block; }
  #carCard b { display: block; font-size: 16px; letter-spacing: 0.03em; }
  #carCard small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #carCard { max-width: 260px; }
  #carCard .traffic { color: var(--fg); margin-top: 6px; }
  #carCard .warn { color: var(--warn); }
  #carCard .history { margin-top: 6px; color: var(--muted); font-size: 12px; }
  #carCard button { display: block; width: 100%; min-height: 40px; margin-top: 8px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--button); color: var(--fg); font: 600 13px system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #carCard button:active { background: var(--button-down); }
  #carCard button.on { color: var(--accent); border-color: var(--accent); }
  /* A phone on its side has little height to spare: the controls move to the
     right-hand edge instead, in two columns to keep that edge narrow:
     reverser and throttle, then the two brakes, then Emergency and Release. */
  @media (orientation: landscape) and (max-height: 520px) {
    body { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
    #bar { border-top: 0; border-left: 1px solid var(--line); justify-content: center;
      padding: 8px calc(12px + env(safe-area-inset-right)) 8px 12px; width: 232px; box-sizing: border-box; }
    #controls { grid-template-columns: 1fr 1fr; gap: 3px 8px;
      grid-template-areas: "revUp thrUp" "revL thrL" "revDown thrDown" "lbUp tbUp" "lbL tbL" "lbDown tbDown"
        "emerg release"; }
    #controls .spacer { display: none; }
    #lbUp, #tbUp, #emergBtn, #releaseBtn { margin-top: 6px; }
    #revUp { grid-area: revUp; } #thrUp { grid-area: thrUp; } #lbUp { grid-area: lbUp; } #tbUp { grid-area: tbUp; }
    #revLever { grid-area: revL; } #thrLever { grid-area: thrL; } #lbLever { grid-area: lbL; } #tbLever { grid-area: tbL; }
    #revDown { grid-area: revDown; } #thrDown { grid-area: thrDown; } #lbDown { grid-area: lbDown; } #tbDown { grid-area: tbDown; }
    #emergBtn { grid-area: emerg; } #releaseBtn { grid-area: release; }
  }
</style>
</head>
<body>
<div id="view"><canvas id="yard"></canvas>
  <div id="zoom">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="followBtn" aria-label="Follow the loco">◎&#xFE0E;</button>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <button id="newYardBtn" aria-label="New yard">↺&#xFE0E;</button>
  </div>
  <div id="clockBar">
    <div id="clock"><b id="clockTime"></b><span id="clockShift"></span></div>
    <button id="skipBtn">Skip ▸&#xFE0E;</button>
  </div>
  <button id="jobChip"></button>
  <button id="jobsBtn">Jobs</button>
  <div id="skipMenu"></div>
  <div id="couplingMenu">
    <button id="airBtn">Air</button>
    <button id="uncoupleBtn">Uncouple</button>
  </div>
  <div id="carCard"><div id="carText"></div><button id="handBrakeBtn"></button></div>
  <div id="sheet"></div>
</div>
<div id="bar">
  <div id="readout"></div>
  <div id="controls">
    <button id="revUp" aria-label="Reverser toward forward">▲&#xFE0E;</button>
    <button id="thrUp" aria-label="Throttle up">+</button>
    <button id="lbUp" aria-label="Loco brake on">+</button>
    <button id="tbUp" aria-label="Train brake on">+</button>
    <button id="releaseBtn" class="word">Release</button>
    <div class="lever" id="revLever"></div>
    <div class="lever" id="thrLever"></div>
    <div class="lever" id="lbLever"></div>
    <div class="lever" id="tbLever"></div>
    <div class="spacer"></div>
    <button id="revDown" aria-label="Reverser toward reverse">▼&#xFE0E;</button>
    <button id="thrDown" aria-label="Throttle down">−</button>
    <button id="lbDown" aria-label="Loco brake off">−</button>
    <button id="tbDown" aria-label="Train brake off">−</button>
    <button id="emergBtn" class="word">Emerg</button>
  </div>
</div>
<script>
"use strict";
(() => {
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // One self-contained file, no build step, no dependencies. Content and
  // mechanics are kept apart so a pass can touch one without the other.
  //
  //   CONFIG       version and every tunable game rule, as named constants.
  //   WORLD DATA   the yard: track nodes, straight or curved segments between
  //                them, switches, and scenery that is drawn but not track;
  //                the kinds of rolling stock, the cars with their
  //                markings and loads, and where it all starts; the yard
  //                tracks' blocks, the destinations waybills name, and the
  //                cars' traffic at the start.
  //                Content passes (a new siding, a new yard) touch only this.
  //   STATE        what changes while playing: the time of day, switch
  //                positions, vehicles, the trains they are coupled into,
  //                the loco's controls, the cars' traffic and the jobs.
  //                Built from WORLD DATA by makeState(); never edits WORLD DATA.
  //   UTILITIES    small geometry, track-walking and lookup helpers.
  //   SIMULATION   advances STATE by one fixed step, step(dt): the clock, and
  //                all movement rules: forces, brakes, slack, contact,
  //                coupling. The events ahead (a job due, a shift change)
  //                come from here too. The
  //                loop calls it at a fixed rate, so behaviour never depends
  //                on the display's frame rate.
  //   OPERATIONS   the rules of the railway's work, stepped from SIMULATION:
  //                cars' traffic and dispositions, jobs opening at shift
  //                changes, their lines checked against the yard, work done
  //                off-screen, rough handling, and results.
  //   ACTIONS      what the player can do (reverser, levers, Emergency,
  //                Release, throw a switch, connect or part the air,
  //                uncouple, set a hand brake, skip ahead, take, hand back
  //                or report a job), and the rules on
  //                when they may. They change STATE; they never draw.
  //   PERSISTENCE  keeps STATE in localStorage between visits, and starts a
  //                new yard. SAVE_KEY changes with every change to the saved
  //                shape.
  //   RENDERING    draws STATE to the canvas and the controls (the job
  //                board and sheet are drawn in INPUT, beside their menus), through a
  //                camera (zoom, follow or pan) that is display only. It
  //                never holds rules.
  //   INPUT / LOOP keyboard, buttons and taps to ACTIONS; the fixed-step loop,
  //                and Pause, which holds the loop's steps and the player's
  //                actions but not the camera; when to save.
  //
  // Coordinates are metres, +x along the yard, +y to its right; WORLD DATA
  // says where north is. They are the world's, not the screen's: RENDERING
  // fits the yard to the screen and, on a portrait screen, turns it a
  // quarter so the yard runs up the screen (see makeView()).
  // Physics is in SI units: metres, seconds, kilograms, newtons.
  //
  // A train is a list of coupled vehicles, ordered from its head to its tail.
  // Each vehicle has its own speed (+ toward its train's head); the couplings
  // between them have play, so a train stretches and bunches (slack). A
  // vehicle stands on the track at its centre, with `dir` the segment sense
  // (+1 toward `b`) that points toward its train's head; a lone car or loco
  // is a train of one.
  // Identity is an id string, never an array index.
  // ==================================================

  // ==================================================
  // CONFIG
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.8.0" };
  const STEP_SECONDS = 1 / 60;          // fixed simulation step
  const MAX_STEPS_PER_FRAME = 5;        // drop time rather than spiral after a stall
  const VIEW_MARGIN = 8;                // metres of ground kept around the yard
  const ZOOM_LEVELS = [1, 2, 4, 7, 10]; // × the whole-yard fit; retunable
  const START_ZOOM = 2;                 // play starts zoomed in, following the loco; an index into ZOOM_LEVELS; retunable
  const DRAG_START_PX = 8;              // CSS px a press moves before it pans instead of tapping
  const TAP_RADIUS_PX = 32;             // CSS px from a switch or coupling that a tap counts; retunable (a fingertip)
  const GAUGE = 1.676;                  // m, Argentine broad gauge (Junín's)
  const TIE_SPACING = 0.65;             // m between tie centres; approximate
  const TIE_LENGTH = 2.75;              // m; approximate
  const TRACK_DETAIL_K = 4;             // px per metre at which track is drawn as rails and ties; retunable
  const SWITCH_DIM_LENGTH = 25;         // m of the unset leg faded past a switch; retunable
  const SWITCH_DIM_STEPS = 5;           // steps the fade is drawn in
  const G = 9.81;                       // m/s²

  // Locomotive pull, modelled on a GM G12 as run in Argentina. The reverser
  // sets its direction (cab end first is forward); each throttle notch gives
  // an equal share of the pull; above LOCO_POWER / LOCO_MAX_FORCE (about
  // 4.3 m/s) the engine's power limits it.
  const THROTTLE_NOTCHES = 4;           // retunable
  const LOCO_MAX_FORCE = 187e3;         // N at full notch; the G12's rated tractive effort
  const LOCO_POWER = 977e3 * 0.8;       // W at the rail: the G12's 977 kW engine less an estimated fifth lost on the way; retunable
  const LOCO_MAX_SPEED = 8;             // m/s (29 km/h); a yard limit, not the G12's own; pull fades to nothing over the last GOVERNOR_BAND
  const GOVERNOR_BAND = 1;              // m/s

  // Rolling resistance, from the constant part of the Davis equation:
  // 1.3 lb per short ton of weight plus a fixed drag per axle that depends
  // on the bearings (29 lb plain, 18 lb roller; AAR RP-548). The speed terms
  // add little at yard speeds and are left out. A loaded 60 t box car on
  // plain bearings comes to about 0.0015 of its weight and rolls about 255 m
  // from 10 km/h; an empty one about 0.0028, 145 m.
  // See docs/reference/train-physics.md.
  const LBF = 4.448;                    // N per pound-force
  const SHORT_TON = 907.2;              // kg
  const DAVIS_WEIGHT_SHARE = 1.3 * LBF / (SHORT_TON * G);  // share of weight, ≈ 0.00065
  const BEARING_AXLE_DRAG = { plain: 29 * LBF, roller: 18 * LBF };  // N per axle
  const STARTING_RESISTANCE = { plain: 0.01, roller: 0.0025 };     // share of weight to get a standing vehicle moving; Unconfirmed, retunable

  // Curve resistance: about 0.7 lb per short ton per degree of curve, where
  // a curve of radius R metres is 1746.4 / R degrees (100 ft chord
  // definition). A vehicle on a curve adds CURVE_RESISTANCE / R of its
  // weight: about 0.004 at 150 m, 0.0075 at 82 m.
  const CURVE_LB_PER_TON_DEGREE = 0.7;  // Secondary; retunable
  const CURVE_RESISTANCE = CURVE_LB_PER_TON_DEGREE * LBF / (SHORT_TON * G) * 1746.4;  // m

  // Brakes. Each is a notched lever; the force builds toward the lever's
  // setting at its rate, as a share of full per second.
  const LOCO_BRAKE_NOTCHES = 4;         // retunable

  // ==================================================
  // STATE
  // ==================================================
  function makeState() {
    // `clock` is the time of day, in seconds since midnight before day 1.
    // `air` holds each coupling whose air is connected, by its pair key, with
    // how far its charge has come (0 to 1).
    // `gaps` holds each coupling's opening past touching, by its pair key: 0
    // fully bunched, COUPLER_FREE_PLAY fully stretched before the draft gear.
    // `cars` holds each car's traffic, by id: its waybill (a DESTINATIONS
    // id, or null), why it is bad order (or null) and its history. `jobs`
    // holds the jobs open and the last JOBS_KEPT finished. `moves` counts
    // the loco's starts from a stand; `nextShiftAt` is the next shift
    // change to act on; `seed` drives the game's choices of traffic.
    const st = { clock: START_CLOCK, switches: {}, vehicles: {}, trains: {}, air: {}, gaps: {}, nextTrain: 1,
                 cars: {}, jobs: [], nextJob: 1, moves: 0, locoMoving: false, nextShiftAt: START_CLOCK,
                 seed: Math.floor(Math.random() * 2 ** 31), notice: null };
    for (const id in SWITCHES) st.switches[id] = { set: SWITCHES[id].normal };
    state = st;                           // walk() reads the switches as it lays trains out
    for (const t of START_TRAINS) {
      for (const v of t.vehicles) {
        const type = startType(v);
        st.vehicles[v.id] = { id: v.id, type, flip: v.flip || 1, speed: 0, handBrake: false };
        if (VEHICLE_TYPES[type].loco) st.vehicles[v.id].controls = { reverser: 0, throttle: 0, locoBrake: 0, trainBrake: 0,
          locoApplied: 0, trainApplied: 0, emergency: false };
      }
      layTrain(t.segment, t.s, t.dir, t.vehicles.map(v => v.id));
    }
    for (const id in CARS) {
      const t = START_TRAFFIC[id] || {};
      st.cars[id] = { waybill: t.waybill || null, badOrder: t.badOrder || null, history: [] };
      if (t.waybill) logCar(id, `Waybill: ${DESTINATIONS[t.waybill].name}`);
      if (t.badOrder) logCar(id, `Bad order: ${t.badOrder}`);
    }
    runShifts();                          // the first shift's jobs open
    return st;
  }
  // Lays vehicles `ids` out as one train, coupled and bunched, back from
  // its head end, which stands `s` metres along `segment` facing `dir` (+1
  // toward the segment's `b`). Each vehicle must already be in no train.
  function layTrain(segment, s, dir, ids) {
    const train = { id: "t" + state.nextTrain++, vehicles: [] };
    let end = { seg: segment, s, travel: -dir };              // walking back from the head
    for (const id of ids) {
      const v = state.vehicles[id], half = vehicleType(v).length / 2;
      const c = walk(end.seg, end.s, end.travel, half);
      Object.assign(v, { train: train.id, seg: c.seg, s: c.s, dir: -c.travel, speed: 0 });
      if (train.vehicles.length) state.gaps[pairKey(train.vehicles[train.vehicles.length - 1], id)] = 0;
      train.vehicles.push(id);
      end = walk(c.seg, c.s, c.travel, half);
    }
    state.trains[train.id] = train;
    for (const id of ids) trailSwitches(state.vehicles[id]);
    return train;
  }
  let state = null;                     // made once every helper exists, at the end of OPERATIONS

  // ==================================================
  // UTILITIES
  // ==================================================
  // Each segment's shape, built once from WORLD DATA: its length along the
  // track and, for a curve, its centre, radius, the angle of `a` seen from
  // the centre, and `turn` (+1 bending right, -1 left).
  const SHAPES = {};
  for (const id in SEGMENTS) {
    const { a, b, r } = SEGMENTS[id], A = NODES[a], B = NODES[b];
    const dx = B.x - A.x, dy = B.y - A.y, chord = Math.hypot(dx, dy);
    if (!r) { SHAPES[id] = { length: chord }; continue; }
    const radius = Math.abs(r), turn = Math.sign(r), half = chord / 2;
    if (radius < half) console.warn(`Segment ${id}: radius ${radius} m is too tight for its ends`);
    // The centre stands off the chord's midpoint, to the side it bends toward.
    const off = Math.sqrt(Math.max(0, radius * radius - half * half)) * turn / chord;
    const cx = A.x + dx / 2 - dy * off, cy = A.y + dy / 2 + dx * off;
    SHAPES[id] = { length: radius * 2 * Math.asin(Math.min(1, half / radius)),
                   cx, cy, radius, turn, start: Math.atan2(A.y - cy, A.x - cx) };
  }
  const segmentLength = segId => SHAPES[segId].length;
  // The point `s` metres along a segment from its `a` end, and the unit
  // vector of the track's direction there, pointing toward `b`.
  function pointOn(segId, s) {
    const g = SHAPES[segId], A = NODES[SEGMENTS[segId].a];
    if (!g.radius) {
      const B = NODES[SEGMENTS[segId].b], ux = (B.x - A.x) / g.length, uy = (B.y - A.y) / g.length;
      return { x: A.x + ux * s, y: A.y + uy * s, ux, uy };
    }
    const angle = g.start + g.turn * s / g.radius, cos = Math.cos(angle), sin = Math.sin(angle);
    return { x: g.cx + g.radius * cos, y: g.cy + g.radius * sin, ux: -g.turn * sin, uy: g.turn * cos };
  }
  // Segments meeting at each node, built once from WORLD DATA.
  const SEGMENTS_AT = {};
  for (const id in NODES) SEGMENTS_AT[id] = [];
  for (const id in SEGMENTS) {
    SEGMENTS_AT[SEGMENTS[id].a].push(id);
    SEGMENTS_AT[SEGMENTS[id].b].push(id);
  }

  // Which segment track arriving at `nodeId` along `fromSeg` continues onto,
  // or null at the end of track. Arriving on a switch's trunk follows the leg
  // it is set to; arriving on a leg returns to the trunk. With `trail`,
  // arriving on a leg also sets the switch to it: a train trailing through a
  // switch set against it pushes it over (a spring switch). Retunable: later
  // this could derail instead.
  function routeFrom(nodeId, fromSeg, trail) {
    const sw = SWITCHES[nodeId];
    if (sw) {
      if (fromSeg === sw.trunk) return state.switches[nodeId].set;
      if (trail) state.switches[nodeId].set = fromSeg;
      return sw.trunk;
    }
    return SEGMENTS_AT[nodeId].find(id => id !== fromSeg) || null;
  }

  // Walks `dist` (≥ 0) metres along the track from `s` on `seg`, heading in
  // segment sense `travel`. Returns where it ends and the sense it is then
  // heading in; at the end of track it stops there with `short` the distance
  // it could not go. `nodes`, when given, collects the nodes it passes.
  function walk(seg, s, travel, dist, trail = false, nodes = null) {
    for (;;) {
      const len = segmentLength(seg), room = travel > 0 ? len - s : s;
      if (dist <= room) return { seg, s: s + travel * dist, travel, short: 0 };
      const nodeId = travel > 0 ? SEGMENTS[seg].b : SEGMENTS[seg].a;
      const next = routeFrom(nodeId, seg, trail);
      if (!next) return { seg, s: travel > 0 ? len : 0, travel, short: dist - room };
      if (nodes) nodes.push(nodeId);
      dist -= room;
      travel = SEGMENTS[next].a === nodeId ? 1 : -1;
      s = travel > 0 ? 0 : segmentLength(next);
      seg = next;
    }
  }

  const vehicleType = v => VEHICLE_TYPES[v.type];
  // A starting vehicle's kind: a car's from CARS, a loco's its own.
  function startType(v) { return CARS[v.id] ? CARS[v.id].type : v.type; }
  // Each vehicle's mass in kg, by id, built once from WORLD DATA: a loco's
  // own; a car's tare, plus its load limit when loaded.
  const MASSES = {};
  for (const t of START_TRAINS) for (const v of t.vehicles) {
    const car = CARS[v.id], type = VEHICLE_TYPES[startType(v)];
    MASSES[v.id] = car ? (type.tare + (car.loaded ? type.carga : 0)) * 1000 : type.mass;
  }
  const vehicleMass = v => MASSES[v.id];
  // A vehicle's two ends: `head` toward its train's head, `tail` away. Each
  // carries `travel`, the segment sense pointing outward from the vehicle.
  function vehicleEnds(v, trail = false, nodes = null) {
    const half = vehicleType(v).length / 2;
    return { head: walk(v.seg, v.s, v.dir, half, trail, nodes),
             tail: walk(v.seg, v.s, -v.dir, half, trail, nodes) };
  }
  function trainEnds(t) {
    return { head: vehicleEnds(state.vehicles[t.vehicles[0]]).head,
             tail: vehicleEnds(state.vehicles[t.vehicles[t.vehicles.length - 1]]).tail };
  }
  const playerLoco = () => state.vehicles[PLAYER_LOCO];
  // A coupling's identity: the ids of the two vehicles it joins, in order.
  const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
  const trainOf = v => state.trains[v.train];

  // Each yard track's shape, built once from WORLD DATA: for each of its
  // segments, `from` (metres from the switch to the segment's start) and
  // `fromA` (whether its `a` end is the switch's side); its length; its
  // buffer node, `end`; and `fouling`, how far from the switch a vehicle's
  // end must be to stand clear of every other track (FOULING_CLEARANCE).
  const TRACK_GEOM = {};
  for (const id in YARD_TRACKS) {
    const segs = {};
    let node = YARD_TRACKS[id].switch, from = 0;
    for (const seg of YARD_TRACKS[id].segments) {
      const fromA = SEGMENTS[seg].a === node;
      segs[seg] = { from, fromA };
      from += segmentLength(seg);
      node = fromA ? SEGMENTS[seg].b : SEGMENTS[seg].a;
    }
    TRACK_GEOM[id] = { segs, length: from, end: node, fouling: 0 };
  }
  // How far along yard track `trackId` from its switch the point `s` on
  // `seg` is, or null when `seg` isn't part of it.
  function trackOffset(trackId, seg, s) {
    const g = TRACK_GEOM[trackId].segs[seg];
    return g ? g.from + (g.fromA ? s : segmentLength(seg) - s) : null;
  }
  // The point `d` metres along yard track `trackId` from its switch.
  function trackPoint(trackId, d) {
    const g = TRACK_GEOM[trackId];
    for (const seg of YARD_TRACKS[trackId].segments) {
      const { from, fromA } = g.segs[seg], len = segmentLength(seg);
      if (d <= from + len) return pointOn(seg, fromA ? d - from : len - (d - from));
    }
    return null;
  }
  // The fouling points: the last metre near the switch where another track
  // comes within FOULING_CLEARANCE, measured against points every metre
  // along every other segment.
  {
    const samples = [];
    for (const seg in SEGMENTS) for (let s = 0, len = segmentLength(seg); s <= len; s += 1) samples.push({ seg, p: pointOn(seg, s) });
    for (const id in TRACK_GEOM) {
      const g = TRACK_GEOM[id], sw = NODES[YARD_TRACKS[id].switch];
      const near = samples.filter(o => !g.segs[o.seg] && Math.hypot(o.p.x - sw.x, o.p.y - sw.y) < 250);
      for (let d = 0; d < Math.min(200, g.length); d += 0.5) {
        const p = trackPoint(id, d);
        if (near.some(o => Math.hypot(o.p.x - p.x, o.p.y - p.y) < FOULING_CLEARANCE)) g.fouling = d + 0.5;
      }
    }
  }
  // The yard track a segment belongs to, or what PLACES calls it, by id.
  const TRACK_OF = {}, PLACE_OF = {};
  for (const id in YARD_TRACKS) for (const seg of YARD_TRACKS[id].segments) TRACK_OF[seg] = id;
  for (const p of PLACES) for (const seg in SEGMENTS) if (p.tracks.some(t => seg === t || seg.startsWith(t + "_"))) PLACE_OF[seg] = p.name;

  // A clock time as HH:MM, and the day it falls on, counted from 1.
  const pad2 = n => String(n).padStart(2, "0");
  const clockText = at => { const m = Math.floor(at / 60) % (24 * 60); return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; };
  const dayOf = at => Math.floor(at / DAY) + 1;

  // ==================================================
  // SIMULATION
  // ==================================================
  // A vehicle's ends trail through switches as well as its centre, so a
  // switch is pushed over the moment a vehicle reaches it.
  function trailSwitches(v) { vehicleEnds(v, true); }

  // Flips a train end for end: same vehicles, same motion, head and tail
  // swapped.
  function reverseTrain(t) {
    t.vehicles.reverse();
    for (const id of t.vehicles) { const v = state.vehicles[id]; v.dir *= -1; v.flip *= -1; v.speed = -v.speed; }
  }

  function setNotice(text) { state.notice = { text, time: NOTICE_SECONDS }; }

  // Moves each lever's brake force toward its setting.
  function stepBrakes(c, dt) {
    const approach = (cur, target, upRate, downRate) => target > cur
      ? Math.min(target, cur + upRate * dt) : Math.max(target, cur - downRate * dt);
    c.locoApplied = approach(c.locoApplied, c.locoBrake / LOCO_BRAKE_NOTCHES, LOCO_BRAKE_RATE, LOCO_BRAKE_RATE);
    c.trainApplied = approach(c.trainApplied, c.trainBrake / TRAIN_BRAKE_NOTCHES,
      c.emergency ? EMERGENCY_RATE : TRAIN_BRAKE_APPLY_RATE, TRAIN_BRAKE_RELEASE_RATE);
  }

  // Charges the air at each coupling linked to a loco by connected air all
  // the way; any other coupling's air is bled off.
  function stepAir(t, dt) {
    const ids = t.vehicles, linked = new Set();
    for (const order of [ids, [...ids].reverse()]) {
      let on = false;
      order.forEach((id, i) => {
        if (state.vehicles[id].controls) { on = true; return; }
        const k = i > 0 ? pairKey(order[i - 1], id) : null;
        on = on && k in state.air;
        if (on) linked.add(k);
      });
    }
    for (let i = 1; i < ids.length; i++) {
      const k = pairKey(ids[i - 1], ids[i]);
      if (k in state.air) state.air[k] = linked.has(k) ? Math.min(1, state.air[k] + dt / AIR_CHARGE_SECONDS) : 0;
    }
  }

  // How much of the train brake reaches each vehicle, by id: all of it on a
  // loco; on a car, the weakest charge between it and a loco; 0 when the air
  // is not connected all the way.
  function brakeReach(t) {
    const ids = t.vehicles, reach = {};
    for (const order of [ids, [...ids].reverse()]) {
      let carry = 0;
      order.forEach((id, i) => {
        if (state.vehicles[id].controls) carry = 1;
        else carry = i > 0 ? Math.min(carry, state.air[pairKey(order[i - 1], id)] || 0) : 0;
        reach[id] = Math.max(reach[id] || 0, carry);
      });
    }
    return reach;
  }

  // The forces on each vehicle of a train this step, by id: `pull` (+
  // toward the head), `hold` from brakes, and the resistance to rolling
  // (`roll`) or to getting a standing vehicle moving (`start`). Curves add
  // to both. The train brake reaches only cars with their air connected and
  // charged; a hand brake holds its car whatever train it is in.
  function vehicleForces(t, out) {
    const reach = brakeReach(t);
    let trainApplied = 0;
    for (const id of t.vehicles) {
      const c = state.vehicles[id].controls;
      if (c) trainApplied = Math.max(trainApplied, c.trainApplied);
    }
    for (const id of t.vehicles) {
      const v = state.vehicles[id], type = vehicleType(v), c = v.controls, weight = vehicleMass(v) * G;
      let pull = 0, hold = 0;
      if (c && c.throttle && c.reverser) {
        const sense = c.reverser * v.flip;                        // toward the head, or not
        const along = v.speed * sense;                            // speed in the direction of pull
        const share = c.throttle / THROTTLE_NOTCHES;
        const force = Math.min(LOCO_MAX_FORCE, LOCO_POWER / Math.max(Math.abs(along), EPS));
        const governor = Math.max(0, Math.min(1, (LOCO_MAX_SPEED - along) / GOVERNOR_BAND));
        pull = sense * share * force * governor;
      }
      if (c) hold += c.locoApplied * LOCO_BRAKE_RATIO * weight;
      hold += trainApplied * TRAIN_BRAKE_RATIO * weight * reach[id];
      if (v.handBrake) hold += HAND_BRAKE_FORCE;
      const radius = SHAPES[v.seg].radius;
      const curve = radius ? CURVE_RESISTANCE / radius * weight : 0;
      out[id] = { pull, hold,
                  roll: DAVIS_WEIGHT_SHARE * weight + type.axles * BEARING_AXLE_DRAG[type.bearing] + curve,
                  start: STARTING_RESISTANCE[type.bearing] * weight + curve };
    }
  }

  // The force in the coupling between `front` and the vehicle `back` behind
  // it: + pulling them together (stretched), − pushing them apart (bunched),
  // nothing while the gap is within the free play.
  function couplerForce(front, back) {
    const gap = state.gaps[pairKey(front.id, back.id)];
    if (gap >= 0 && gap <= COUPLER_FREE_PLAY) return 0;
    const opening = front.speed - back.speed;                     // how fast the gap grows
    const mF = vehicleMass(front), mB = vehicleMass(back);
    const damping = 2 * DRAFT_GEAR_DAMPING * Math.sqrt(DRAFT_GEAR_STIFFNESS * mF * mB / (mF + mB));
    if (gap > 0) return Math.max(0, DRAFT_GEAR_STIFFNESS * (gap - COUPLER_FREE_PLAY) + damping * opening);
    return Math.min(0, DRAFT_GEAR_STIFFNESS * gap + damping * opening);
  }

  // Changes a vehicle's speed by `applied` (its pull and coupler forces, +
  // toward the head) against its brakes and resistance, which hold back
  // but never more than it takes to stop. A standing vehicle stays put
  // until `applied` beats its brakes and starting resistance, so a loco
  // takes up the slack and starts a cut one car at a time.
  function accelerateVehicle(v, f, applied, dt) {
    const m = vehicleMass(v);
    if (v.speed === 0) {
      if (Math.abs(applied) <= f.hold + f.start) return;
      v.speed = Math.sign(applied) * (Math.abs(applied) - f.hold - f.roll) / m * dt;
      return;
    }
    const next = v.speed + (applied - Math.sign(v.speed) * (f.hold + f.roll)) / m * dt;
    v.speed = Math.sign(next) === Math.sign(v.speed) ? next : 0;
  }

  // The nearest thing ahead of a train end within `dist` metres: another
  // train's end facing it, or the end of track. null when the way is clear.
  // An end facing it up to DRAFT_GEAR_TRAVEL behind still counts, touching:
  // a coupling parted while bunched leaves its two ends pressed that far
  // into each other. Looking ahead never pushes switches over.
  function findObstacle(end, dist, selfId) {
    const others = [];
    for (const id in state.trains) {
      if (id === selfId) continue;
      const e = trainEnds(state.trains[id]);
      others.push({ train: id, which: "head", ...e.head }, { train: id, which: "tail", ...e.tail });
    }
    let { seg, s, travel } = end, gone = 0;
    for (;;) {
      const len = segmentLength(seg), room = travel > 0 ? len - s : s;
      const reach = Math.min(room, dist - gone);
      let best = null;
      for (const o of others) {
        if (o.seg !== seg || o.travel !== -travel) continue;
        const d = (o.s - s) * travel;
        if (d >= -DRAFT_GEAR_TRAVEL && d <= reach + EPS && (!best || d < best.d)) best = { ...o, d };
      }
      if (best) return { kind: "train", train: best.train, which: best.which, gap: gone + Math.max(0, best.d) };
      if (dist - gone <= room) return null;
      gone += room;
      const nodeId = travel > 0 ? SEGMENTS[seg].b : SEGMENTS[seg].a;
      const next = routeFrom(nodeId, seg, false);
      if (!next) return { kind: "buffer", gap: gone };
      travel = SEGMENTS[next].a === nodeId ? 1 : -1;
      s = travel > 0 ? 0 : segmentLength(next);
      seg = next;
    }
  }

  // Moves a vehicle `d` metres (+ toward its train's head).
  function moveVehicle(v, d) {
    if (d === 0) return;
    const sense = Math.sign(d);
    const p = walk(v.seg, v.s, v.dir * sense, Math.abs(d), true);
    v.seg = p.seg; v.s = p.s; v.dir = p.travel * sense;
    trailSwitches(v);
  }

  // How hard each pair of touching train ends presses together, by pair key:
  // the push between them averaged over PRESS_SECONDS, so a brief bump
  // counts for little and a steady shove for its full force.
  const pressing = {};

  // The vehicle at end `which` ("head" or "tail") of train `t`.
  const endVehicle = (t, which) => state.vehicles[t.vehicles[which === "head" ? 0 : t.vehicles.length - 1]];
  // Which end of train `t` its end vehicle `v` is; for a train of one, the
  // end it met with, `which`.
  const endOf = (t, v, which) => t.vehicles.length === 1 ? which : t.vehicles[0] === v.id ? "head" : "tail";

  // Train X's end `xEnd` has met train Y's end `yEnd`. The two end vehicles
  // meet; the rest feel it through their couplings. Speeds are compared
  // along one axis, pointing from X into Y.
  function contact(X, xEnd, Y, yEnd) {
    const a = endVehicle(X, xEnd), b = endVehicle(Y, yEnd);
    const xs = xEnd === "head" ? 1 : -1, ys = yEnd === "head" ? -1 : 1;
    const uA = a.speed * xs, uB = b.speed * ys, closing = uA - uB;
    if (closing <= 0) return;                                   // already parting
    const mA = vehicleMass(a), mB = vehicleMass(b);
    const shared = (mA * uA + mB * uB) / (mA + mB);              // momentum is kept
    const damaged = closing > DAMAGE_SPEED ? [a, b].filter(v => damageCar(v.id, closing)).map(v => carName(v.id)) : [];
    if (damaged.length) setNotice(`${damaged.join(", ")} damaged at ${(closing * 3.6).toFixed(0)} km/h: bad order`);
    if (closing > COUPLE_MAX_SPEED) {
      a.speed = (shared + HARD_HIT_RESTITUTION * (shared - uA)) * xs;
      b.speed = (shared + HARD_HIT_RESTITUTION * (shared - uB)) * ys;
      if (!damaged.length) setNotice(`Hard hit at ${(closing * 3.6).toFixed(0)} km/h`);
      return;
    }
    const k = pairKey(a.id, b.id);
    pressing[k] = (pressing[k] || 0) + mB * (shared - uB) / PRESS_SECONDS;
    a.speed = shared * xs;
    b.speed = shared * ys;
    // Fast enough, or pressed hard enough, they couple; else a gentle touch
    // just pushes.
    if (closing >= COUPLE_MIN_SPEED || pressing[k] >= COUPLE_PUSH_FORCE) {
      delete pressing[k];
      couple(X, xEnd, Y, yEnd);
    }
  }

  // Joins Y onto X. X's coupling end becomes its tail and Y's its head, so
  // the joined train runs X's vehicles then Y's. The new coupling starts
  // fully bunched, the two ends touching.
  function couple(X, xEnd, Y, yEnd) {
    if (xEnd === "head") reverseTrain(X);
    if (yEnd === "tail") reverseTrain(Y);
    state.gaps[pairKey(X.vehicles[X.vehicles.length - 1], Y.vehicles[0])] = 0;
    for (const id of Y.vehicles) state.vehicles[id].train = X.id;
    X.vehicles = X.vehicles.concat(Y.vehicles);
    delete state.trains[Y.id];
  }

  // Moves each vehicle of a train by its own speed. The two end vehicles
  // stop short at whatever they meet, then meet it; each coupling's gap
  // changes by how far its two vehicles moved apart.
  function advance(t, dt) {
    const ids = t.vehicles.slice(), last = ids.length - 1, moved = {}, hits = [];
    ids.forEach((id, i) => {
      const v = state.vehicles[id], d = v.speed * dt;
      const lead = i === 0 && d > 0 ? "head" : i === last && d < 0 ? "tail" : null;
      const hit = lead && findObstacle(vehicleEnds(v)[lead], Math.abs(d), t.id);
      moved[id] = hit ? Math.sign(d) * hit.gap : d;
      moveVehicle(v, moved[id]);
      if (hit) hits.push({ v, lead, hit, other: hit.kind === "train" && endVehicle(state.trains[hit.train], hit.which) });
    });
    for (let i = 0; i < last; i++) state.gaps[pairKey(ids[i], ids[i + 1])] += moved[ids[i]] - moved[ids[i + 1]];
    for (const { v, lead, hit, other } of hits) {
      if (hit.kind === "buffer") {
        // A buffer stop: the vehicle stops against it.
        if (Math.abs(v.speed) > COUPLE_MAX_SPEED) setNotice(`Hit the buffers at ${(Math.abs(v.speed) * 3.6).toFixed(0)} km/h`);
        v.speed = 0;
        continue;
      }
      // An earlier meeting this substep may have joined or turned the trains.
      const X = trainOf(v), Y = trainOf(other);
      if (X !== Y) contact(X, endOf(X, v, lead), Y, endOf(Y, other, hit.which));
    }
  }

  // One substep: coupler forces, then speeds, then moves.
  function substep(forces, dt) {
    for (const id in state.trains) {
      const ids = state.trains[id].vehicles, applied = {};
      for (const vid of ids) applied[vid] = forces[vid].pull;
      for (let i = 0; i + 1 < ids.length; i++) {
        const tension = couplerForce(state.vehicles[ids[i]], state.vehicles[ids[i + 1]]);
        applied[ids[i]] -= tension;
        applied[ids[i + 1]] += tension;
      }
      for (const vid of ids) accelerateVehicle(state.vehicles[vid], forces[vid], applied[vid], dt);
    }
    for (const k in pressing) if ((pressing[k] -= pressing[k] * dt / PRESS_SECONDS) < 1) delete pressing[k];
    for (const id of Object.keys(state.trains)) if (state.trains[id]) advance(state.trains[id], dt);
  }

  function step(dt) {
    state.clock += dt;
    for (const id in state.vehicles) if (state.vehicles[id].controls) stepBrakes(state.vehicles[id].controls, dt);
    for (const id in state.trains) stepAir(state.trains[id], dt);
    const forces = {};
    for (const id in state.trains) vehicleForces(state.trains[id], forces);
    for (let i = 0; i < SLACK_SUBSTEPS; i++) substep(forces, dt / SLACK_SUBSTEPS);
    countMoves();
    runShifts();
    if (state.notice && (state.notice.time -= dt) <= 0) state.notice = null;
  }

  // The shift the clock `at` falls in: when it began and when it ends.
  function shiftAt(at) {
    const len = SHIFT_HOURS * HOUR;
    const start = START_CLOCK + Math.floor((at - START_CLOCK) / len) * len;
    return { start, end: start + len };
  }
  // The events ahead of the clock, soonest first, up to and including the
  // end of this shift: jobs falling due, and the shift change, when the
  // next jobs open.
  function eventsAhead() {
    const end = shiftAt(state.clock).end, out = [];
    for (const j of state.jobs) if (!j.result && j.due > state.clock && j.due <= end) out.push({ at: j.due, kind: "due", job: j.id });
    out.push({ at: end, kind: "shift" });
    return out;
  }
  // The first SKIP_MARK_SECONDS mark after the clock.
  const nextMark = () => (Math.floor(state.clock / SKIP_MARK_SECONDS) + 1) * SKIP_MARK_SECONDS;

  // Whether any vehicle stands over a node.
  function nodeOccupied(nodeId) {
    for (const id in state.vehicles) {
      const nodes = [];
      vehicleEnds(state.vehicles[id], false, nodes);
      if (nodes.includes(nodeId)) return true;
    }
    return false;
  }

  // ==================================================
  // OPERATIONS
  // ==================================================
  // Traffic, dispositions, jobs and results, in stage 1's simplest form
  // (docs/design/, #48). Each car has a waybill, is sound or bad order, and
  // keeps a history. Its disposition, the next step the game decides for
  // it, sends it to a block's yard track, or leaves it where it is. A job
  // is the cars whose dispositions aren't met when it opens; its lines are
  // checked against the yard as it stands, so a car damaged mid-job
  // changes its line. Jobs open at a shift change and fall due at the next;
  // one not taken is done off-screen then, by another crew.

  // The game's own choices (which cars get new waybills, and where to)
  // come from `state.seed`, so a saved yard goes on the same way.
  function random() {
    let t = state.seed = (state.seed + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const carName = id => `${CARS[id].line || "FA"} ${CARS[id].number}`;
  function logCar(id, text, at = state.clock) {
    const h = state.cars[id].history;
    h.push({ at, text });
    if (h.length > HISTORY_KEPT) h.shift();
  }
  const jobById = id => state.jobs.find(j => j.id === id);
  const openJobs = () => state.jobs.filter(j => !j.result);

  // The block a car goes to next, or null when it stays where it is.
  // Placeholder rule until #45: a bad-order car goes to repair; otherwise
  // its waybill's destination decides.
  function dispositionOf(id) {
    const c = state.cars[id];
    if (c.badOrder) return "repair";
    return c.waybill ? DESTINATIONS[c.waybill].block : null;
  }
  const blockTracks = block => Object.keys(YARD_TRACKS).filter(t => YARD_TRACKS[t].block === block);
  const inPlayerTrain = v => v.train === playerLoco().train;
  // The yard track a vehicle's middle is on, or null.
  const trackAt = v => TRACK_OF[v.seg] || null;
  // Whether a vehicle stands wholly on yard track `trackId`, clear of its
  // fouling point.
  function clearOn(v, trackId) {
    const e = vehicleEnds(v);
    return [e.head, e.tail].every(end => {
      const d = trackOffset(trackId, end.seg, end.s);
      return d !== null && d >= TRACK_GEOM[trackId].fouling;
    });
  }
  // A car's disposition is met when it is left (not in the loco's train)
  // clear on one of its block's tracks, or when it has none.
  function dispositionMet(id) {
    const block = dispositionOf(id), v = state.vehicles[id];
    return !block || (!inPlayerTrain(v) && blockTracks(block).some(t => clearOn(v, t)));
  }
  // Whether a block in `block` order stands in it on each of its tracks:
  // from the ladder end, its cars' destinations come in its groups' order.
  // Cars on the track with another disposition don't count.
  function blockInOrder(block) {
    const groups = BLOCKS[block].groups;
    for (const t of blockTracks(block)) {
      const order = Object.keys(state.cars)
        .filter(id => dispositionOf(id) === block && trackAt(state.vehicles[id]) === t)
        .map(id => { const v = state.vehicles[id]; return { g: groups.indexOf(state.cars[id].waybill), d: trackOffset(t, v.seg, v.s) }; })
        .sort((a, b) => a.d - b.d);
      if (order.some((o, i) => i && o.g < order[i - 1].g)) return false;
    }
    return true;
  }
  // A job checked against the yard: a line per car (its block, and whether
  // it's met), how many are met, and whether each block in block order the
  // job touches stands in it (null when it touches none).
  function jobStatus(job) {
    const lines = job.cars.map(id => ({ id, block: dispositionOf(id), met: dispositionMet(id) }));
    const ordered = [...new Set(lines.map(l => l.block))].filter(b => b && BLOCKS[b].ordering === "block");
    return { lines, met: lines.filter(l => l.met).length,
             inOrder: ordered.length ? ordered.every(blockInOrder) : null };
  }

  // Each start of the player's loco from a stand is a move.
  function countMoves() {
    const moving = playerLoco().speed !== 0;
    if (moving && !state.locoMoving) state.moves++;
    state.locoMoving = moving;
  }

  // Rough handling: a car hit harder than DAMAGE_SPEED goes bad order.
  // Returns whether it was damaged now. Jobs being worked note it.
  function damageCar(id, speed) {
    if (!CARS[id] || state.cars[id].badOrder) return false;
    state.cars[id].badOrder = `Damaged in a hit at ${(speed * 3.6).toFixed(0)} km/h`;
    logCar(id, `Bad order: ${state.cars[id].badOrder}`);
    for (const j of openJobs()) if (j.taken) j.damaged.push(id);
    return true;
  }

  // Acts on every shift change the clock has reached.
  function runShifts() {
    while (state.clock >= state.nextShiftAt) {
      shiftChange(state.nextShiftAt);
      state.nextShiftAt += SHIFT_HOURS * HOUR;
    }
  }
  // At a shift change: cars left on the repair track are repaired, jobs
  // not taken that fall due are done off-screen, and the next jobs open.
  function shiftChange(at) {
    for (const id in state.cars) {
      const v = state.vehicles[id];
      if (state.cars[id].badOrder && dispositionMet(id) && v.speed === 0) {
        Object.assign(state.cars[id], { badOrder: null, waybill: null });
        logCar(id, `Repaired on ${YARD_TRACKS[trackAt(v)].name}`, at);
      }
    }
    for (const j of openJobs()) if (!j.taken && j.due <= at) doOffScreen(j, at);
    openShiftJobs(at);
    const done = state.jobs.filter(j => j.result);
    if (done.length > JOBS_KEPT) state.jobs = state.jobs.filter(j => !j.result || done.indexOf(j) >= done.length - JOBS_KEPT);
  }

  // Opens a shift's jobs at `at`: the cars whose dispositions aren't met
  // and aren't already in an open job, topped up to CARS_PER_JOB a job with
  // new waybills, dealt out a block at a time.
  function openShiftJobs(at) {
    const busy = new Set(openJobs().flatMap(j => j.cars));
    const needing = Object.keys(CARS).filter(id => !busy.has(id) && !dispositionMet(id));
    const want = CARS_PER_JOB * JOBS_PER_SHIFT;
    if (needing.length < want) needing.push(...rebill(want - needing.length, busy, at));
    const blockOrder = Object.keys(BLOCKS);
    needing.sort((a, b) => blockOrder.indexOf(dispositionOf(a)) - blockOrder.indexOf(dispositionOf(b)));
    const per = Math.ceil(needing.length / JOBS_PER_SHIFT), due = at + SHIFT_HOURS * HOUR;
    for (let i = 0; i < JOBS_PER_SHIFT; i++) {
      const cars = needing.slice(i * per, (i + 1) * per);
      if (!cars.length) continue;
      state.jobs.push({ id: "job" + state.nextJob++, title: `Sort the yard for the ${clockText(due)} shift`,
        opens: at, due, cars, blocks: new Set(cars.map(dispositionOf)).size,
        taken: false, movesAtTake: 0, damaged: [], result: null });
    }
  }
  // Issues new waybills to up to `count` cars standing where they belong,
  // sound and not in the loco's train or a job, those with no waybill
  // first. Each goes to a destination for its load, in another block than
  // the one it stands in. Returns their ids.
  function rebill(count, busy, at) {
    const pool = Object.keys(CARS).filter(id => !busy.has(id) && !state.cars[id].badOrder && dispositionMet(id)
      && state.vehicles[id].speed === 0 && !inPlayerTrain(state.vehicles[id]));
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    pool.sort((a, b) => !!state.cars[a].waybill - !!state.cars[b].waybill);
    const out = [];
    for (const id of pool) {
      if (out.length >= count) break;
      const here = trackAt(state.vehicles[id]), block = here && YARD_TRACKS[here].block;
      const choices = Object.keys(DESTINATIONS).filter(d =>
        DESTINATIONS[d].block !== block && (DESTINATIONS[d].loaded === undefined || DESTINATIONS[d].loaded === CARS[id].loaded));
      if (!choices.length) continue;
      const d = choices[Math.floor(random() * choices.length)];
      state.cars[id].waybill = d;
      logCar(id, `Waybill: ${DESTINATIONS[d].name}`, at);
      out.push(id);
    }
    return out;
  }

  // Another crew does a job off-screen at `at`: each car not yet where it
  // belongs, standing and not in the loco's train, is set on a track of its
  // block. Cars it can't set (the track blocked or full) stay put.
  function doOffScreen(job, at) {
    const left = [];
    for (const id of job.cars) {
      if (dispositionMet(id)) continue;
      const v = state.vehicles[id];
      const track = v.speed === 0 && !inPlayerTrain(v) && blockTracks(dispositionOf(id)).find(t => setOnTrack(t, id));
      if (track) logCar(id, `Set on ${YARD_TRACKS[track].name} by another crew`, at);
      else left.push(id);
    }
    job.result = { by: "crew", at, left };
  }
  // Takes vehicle `id` out of its train, splitting the train around it.
  function detach(id) {
    const v = state.vehicles[id], t = trainOf(v), i = t.vehicles.indexOf(id);
    for (const j of [i - 1, i + 1]) if (t.vehicles[j]) {
      const k = pairKey(id, t.vehicles[j]);
      delete state.air[k]; delete state.gaps[k];
    }
    delete state.trains[t.id];
    for (const part of [t.vehicles.slice(0, i), t.vehicles.slice(i + 1)]) {
      if (!part.length) continue;
      const nt = { id: "t" + state.nextTrain++, vehicles: part };
      for (const p of part) state.vehicles[p].train = nt.id;
      state.trains[nt.id] = nt;
    }
    v.train = null;
  }
  // Sets car `id` on yard track `trackId`, off-screen: the cars already
  // there and it are laid out again as one cut from the buffer, it at the
  // ladder end, or in its group's place for a block in block order. Not
  // done, and false, when a vehicle on the track is moving, is the loco or
  // reaches off it, or when the cut wouldn't stand clear.
  function setOnTrack(trackId, id) {
    const g = TRACK_GEOM[trackId], trains = new Set();
    for (const vid in state.vehicles) {
      const v = state.vehicles[vid], e = vehicleEnds(v);
      if ([v, e.head, e.tail].some(p => g.segs[p.seg])) trains.add(v.train);
    }
    const there = [];
    for (const tid of trains) for (const vid of state.trains[tid].vehicles) {
      const v = state.vehicles[vid], e = vehicleEnds(v);
      if (v.controls || v.speed !== 0 || !g.segs[e.head.seg] || !g.segs[e.tail.seg]) return false;
      if (vid !== id) there.push({ vid, d: trackOffset(trackId, v.seg, v.s) });
    }
    const cut = there.sort((a, b) => b.d - a.d).map(o => o.vid).concat(id);   // from the buffer
    const block = BLOCKS[YARD_TRACKS[trackId].block];
    if (block.ordering === "block") {
      const rank = vid => { const g = block.groups.indexOf(state.cars[vid].waybill); return dispositionOf(vid) === YARD_TRACKS[trackId].block && g >= 0 ? g : -1; };
      cut.sort((a, b) => rank(b) - rank(a));
    }
    const length = cut.reduce((sum, vid) => sum + vehicleType(state.vehicles[vid]).length, 0);
    if (length + SET_BACK > g.length - g.fouling) return false;
    for (const vid of cut) detach(vid);
    const segs = YARD_TRACKS[trackId].segments, last = segs[segs.length - 1], dir = SEGMENTS[last].b === g.end ? 1 : -1;
    layTrain(last, dir > 0 ? segmentLength(last) - SET_BACK : SET_BACK, dir, cut);
    return true;
  }

  // Assesses a job the player reports done at `at` (docs/design/results.md):
  // correctness, ordering, moves against par, timeliness, and the cars
  // damaged while it was worked.
  function assess(job, at) {
    const st = jobStatus(job), moves = state.moves - job.movesAtTake;
    const par = PAR_PER_CAR_AND_BLOCK * (job.cars.length + job.blocks);
    let outcome;
    if (st.met === st.lines.length) outcome = st.inOrder === false ? "Invalid formation" : moves > par ? "Valid but inefficient" : "Operationally valid";
    else outcome = st.met ? "Partially complete" : "Incomplete";
    for (const l of st.lines) if (l.met && l.block) logCar(l.id, `Left on ${YARD_TRACKS[trackAt(state.vehicles[l.id])].name}, ${BLOCKS[l.block].name}`, at);
    job.result = { by: "player", at, outcome, met: st.met, total: st.lines.length, inOrder: st.inOrder,
                   moves, par, late: Math.max(0, at - job.due) };
  }

  state = makeState();

  // ==================================================
  // ACTIONS
  // ==================================================
  const clampNotch = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  // The reverser: forward (+1), neutral (0) or reverse (−1), one position a
  // press. It moves only with the throttle shut and the train stopped.
  // Retunable: both rules are design choices.
  function moveReverser(delta) {
    const v = playerLoco(), c = v.controls;
    const next = clampNotch(c.reverser + delta, -1, 1);
    if (next === c.reverser) return false;
    if (c.throttle) { setNotice("Shut the throttle first"); return false; }
    if (v.speed !== 0) { setNotice("Stop before moving the reverser"); return false; }
    c.reverser = next;
    return true;
  }
  // The throttle opens only with the reverser in forward or reverse.
  function moveThrottle(delta) {
    const c = playerLoco().controls;
    if (delta > 0 && !c.reverser) { setNotice("Reverser is in neutral"); return; }
    c.throttle = clampNotch(c.throttle + delta, 0, THROTTLE_NOTCHES);
  }
  function moveLocoBrake(delta) {
    const c = playerLoco().controls;
    c.locoBrake = clampNotch(c.locoBrake + delta, 0, LOCO_BRAKE_NOTCHES);
  }
  function moveTrainBrake(delta) {
    const c = playerLoco().controls;
    c.trainBrake = clampNotch(c.trainBrake + delta, 0, TRAIN_BRAKE_NOTCHES);
    c.emergency = false;
  }
  // Emergency: power off, both brakes full, the train brake at its fastest.
  function emergency() {
    const c = playerLoco().controls;
    c.throttle = 0; c.locoBrake = LOCO_BRAKE_NOTCHES; c.trainBrake = TRAIN_BRAKE_NOTCHES; c.emergency = true;
  }
  // Release: both brake levers off.
  function release() {
    const c = playerLoco().controls;
    c.locoBrake = 0; c.trainBrake = 0; c.emergency = false;
  }
  // A switch with a vehicle over it cannot be thrown.
  function throwSwitch(swId) {
    if (nodeOccupied(swId)) { setNotice("A train is on that switch"); return false; }
    const sw = SWITCHES[swId], cur = state.switches[swId];
    cur.set = cur.set === sw.legs[0] ? sw.legs[1] : sw.legs[0];
    return true;
  }
  // The vehicle coupled behind `vehicleId` in its train, or null.
  function behind(vehicleId) {
    const t = trainOf(state.vehicles[vehicleId]), i = t.vehicles.indexOf(vehicleId);
    return i >= 0 && i < t.vehicles.length - 1 ? t.vehicles[i + 1] : null;
  }
  // Connects or parts the air at the coupling behind `vehicleId`. Newly
  // connected air starts uncharged.
  function toggleAir(vehicleId) {
    const next = behind(vehicleId);
    if (!next) return false;
    const k = pairKey(vehicleId, next);
    if (k in state.air) delete state.air[k]; else state.air[k] = 0;
    return true;
  }
  // Sets or releases a car's hand brake. A loco has none; it has its own brake.
  function toggleHandBrake(vehicleId) {
    const v = state.vehicles[vehicleId];
    if (!v || v.controls) return false;
    v.handBrake = !v.handBrake;
    return true;
  }
  // Uncouples a train behind its vehicle `vehicleId`, parting the air there
  // too. Both parts keep moving; a part without a loco has its air bled off.
  function uncouple(vehicleId) {
    const v = state.vehicles[vehicleId], t = trainOf(v), i = t.vehicles.indexOf(vehicleId);
    if (i < 0 || i === t.vehicles.length - 1) return false;
    delete state.air[pairKey(vehicleId, t.vehicles[i + 1])];
    delete state.gaps[pairKey(vehicleId, t.vehicles[i + 1])];
    const rest = { id: "t" + state.nextTrain++, vehicles: t.vehicles.slice(i + 1) };
    t.vehicles = t.vehicles.slice(0, i + 1);
    for (const id of rest.vehicles) state.vehicles[id].train = rest.id;
    state.trains[rest.id] = rest;
    return true;
  }

  // Skips the clock ahead to `at`, an event ahead or a SKIP_MARK_SECONDS
  // mark, only while every vehicle stands still. Nothing else moves or
  // changes: no physics runs during a skip.
  function skipTo(at) {
    if (!(at > state.clock) || !(at % SKIP_MARK_SECONDS === 0 || eventsAhead().some(e => e.at === at))) return false;
    if (playerLoco().speed !== 0) { setNotice("Stop the loco before skipping"); return false; }
    for (const id in state.vehicles) {
      if (state.vehicles[id].speed !== 0) { setNotice("Wait for the cars to stop"); return false; }
    }
    state.clock = at;
    runShifts();
    return true;
  }

  // Jobs: the player takes one from the board, hands it back, or reports it
  // done, which assesses it. A job handed back after it fell due goes to
  // another crew at once.
  function takeJob(jobId) {
    const j = jobById(jobId);
    if (!j || j.result || j.taken) return false;
    Object.assign(j, { taken: true, movesAtTake: state.moves, damaged: [] });
    return true;
  }
  function handBack(jobId) {
    const j = jobById(jobId);
    if (!j || j.result || !j.taken) return false;
    j.taken = false;
    if (j.due <= state.clock) doOffScreen(j, state.clock);
    return true;
  }
  function reportDone(jobId) {
    const j = jobById(jobId);
    if (!j || j.result || !j.taken) return false;
    assess(j, state.clock);
    return true;
  }

  // ==================================================
  // PERSISTENCE
  // ==================================================
  // The yard is saved as it stands, mid-move included: every vehicle with
  // its speed, the trains, couplings' slack and air, switches, hand brakes,
  // the loco's controls, the clock, the cars' traffic and the jobs. That is
  // all of STATE but the notice. A yard saved before jobs isn't carried
  // over: its cars stand where jobs didn't expect them. A save
  // that doesn't fit the yard (WORLD DATA changed since) is set aside for a
  // fresh yard. SAVE_KEY changes with every change to the saved shape.
  const SAVE_KEY = "switching-game.yard.3";

  function saveYard() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ version: GAME_CONFIG.VERSION, state: { ...state, notice: null } }));
    } catch (e) { /* storage full or blocked: play goes on unsaved */ }
  }

  // Whether a saved STATE fits this yard: the same switches and vehicles,
  // every vehicle on a segment that exists, every train whole, and slack
  // at every coupling.
  function fitsYard(st) {
    const isObj = o => !!o && typeof o === "object";
    const sameKeys = (o, ref) => isObj(o) && Object.keys(o).sort().join() === Object.keys(ref).sort().join();
    if (!isObj(st) || !(st.clock >= 0 && Number.isFinite(st.clock))) return false;
    if (!isObj(st.trains) || !isObj(st.air) || !isObj(st.gaps) || !Number.isInteger(st.nextTrain)) return false;
    if (!sameKeys(st.switches, SWITCHES)) return false;
    if (!sameKeys(st.cars, CARS) || !Array.isArray(st.jobs) || !Number.isInteger(st.nextJob) || !Number.isInteger(st.moves)
        || !Number.isInteger(st.seed) || !Number.isFinite(st.nextShiftAt)) return false;
    for (const id in st.cars) {
      const c = st.cars[id];
      if (!Array.isArray(c.history) || (c.waybill !== null && !DESTINATIONS[c.waybill])) return false;
    }
    for (const j of st.jobs) if (!isObj(j) || !Array.isArray(j.cars) || !j.cars.every(id => CARS[id]) || !Number.isFinite(j.due)) return false;
    for (const id in SWITCHES) if (!SWITCHES[id].legs.includes(st.switches[id].set)) return false;
    const startIds = {};
    for (const t of START_TRAINS) for (const v of t.vehicles) startIds[v.id] = startType(v);
    if (!sameKeys(st.vehicles, startIds)) return false;
    for (const id in st.vehicles) {
      const v = st.vehicles[id], type = VEHICLE_TYPES[v.type];
      if (v.id !== id || v.type !== startIds[id] || !SEGMENTS[v.seg] || !st.trains[v.train]) return false;
      if (!(v.s >= 0 && v.s <= segmentLength(v.seg)) || !Number.isFinite(v.speed)) return false;
      if (Math.abs(v.dir) !== 1 || Math.abs(v.flip) !== 1 || !!type.loco !== isObj(v.controls)) return false;
    }
    const placed = {};
    for (const tid in st.trains) {
      const ids = st.trains[tid].vehicles;
      if (st.trains[tid].id !== tid || !Array.isArray(ids) || !ids.length) return false;
      for (let i = 0; i < ids.length; i++) {
        const v = st.vehicles[ids[i]];
        if (!v || v.train !== tid || placed[ids[i]]) return false;
        placed[ids[i]] = true;
        if (i && !Number.isFinite(st.gaps[pairKey(ids[i - 1], ids[i])])) return false;
      }
    }
    return Object.keys(placed).length === Object.keys(startIds).length;
  }

  // The saved yard, if there is one that fits; otherwise the fresh one
  // makeState() built stays.
  function loadYard() {
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (saved && fitsYard(saved.state)) { state = saved.state; return true; }
    } catch (e) { /* unreadable or blocked: start fresh */ }
    return false;
  }

  // A fresh yard as WORLD DATA lays it out, saved over the old one.
  function newYard() {
    state = makeState();
    for (const k in pressing) delete pressing[k];
    saveYard();
  }

  const restored = loadYard();

  // ==================================================
  // RENDERING
  // ==================================================
  // Canvas colours, matched to the page's CSS palette. Rolling stock keeps
  // its own colours in WORLD DATA.
  const PALETTE = {
    bg: "#000",
    trackFar: "#6f7378",   // track as one line, zoomed out: cool steel grey
    ties: "#40392f",       // dark, so the rails lead and the ties are texture
    rails: "#b7bbc0",
    buffer: "#d9d6cf",
    switchEdge: "#000",
    switchNormal: "#34c06a",
    switchReversed: "#f5c400",
    light: "#f4efe6",      // cab, hand-brake band, notices
    accent: "#f2b13c",     // reverser arrow, Paused; the CSS --accent
    air: "#5aa9ff",
    north: "#7a7b80",      // the CSS --muted
    scenery: "#3b3e42",    // the main line: track the player can't use, dimmer than the yard's
    label: "#1c1d20",      // a yard track's number disc
  };
  const canvas = document.getElementById("yard");
  const ctx = canvas.getContext("2d");
  const readout = document.getElementById("readout");
  const followBtn = document.getElementById("followBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const levers = { rev: document.getElementById("revLever"), thr: document.getElementById("thrLever"), lb: document.getElementById("lbLever"),
                   tb: document.getElementById("tbLever") };

  // Points every few metres along a stretch of a segment, from `s0` to `s1`,
  // for drawing it. A straight needs only its ends.
  function trackPoints(segId, s0, s1) {
    const n = SHAPES[segId].radius ? Math.max(1, Math.ceil(Math.abs(s1 - s0) / 2)) : 1, out = [];
    for (let i = 0; i <= n; i++) out.push(pointOn(segId, s0 + (s1 - s0) * i / n));
    return out;
  }

  // World bounds, from WORLD DATA, once. Curves can bow out past their nodes.
  const BOUNDS = (() => {
    const pts = Object.keys(SEGMENTS).flatMap(id => trackPoints(id, 0, segmentLength(id)));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    return { minX: Math.min(...xs) - VIEW_MARGIN, maxX: Math.max(...xs) + VIEW_MARGIN,
             minY: Math.min(...ys) - VIEW_MARGIN, maxY: Math.max(...ys) + VIEW_MARGIN };
  })();

  // What the screen shows. Zoomed out it fits the whole yard; zoomed in it
  // follows the player's loco until a drag pans it to (cx, cy).
  const camera = { zoom: START_ZOOM, follow: true, cx: 0, cy: 0 };

  // The world→screen mapping for a canvas of w×h CSS px. A yard wider than
  // it is tall, on a screen taller than it is wide, is turned a quarter
  // anticlockwise: +x runs up the screen and +y runs right. The view
  // centres on the camera's point, kept so the yard never leaves the screen.
  function makeView(w, h) {
    const ww = BOUNDS.maxX - BOUNDS.minX, wh = BOUNDS.maxY - BOUNDS.minY;
    const turned = (h > w) === (ww > wh);
    const sw = turned ? wh : ww, sh = turned ? ww : wh;   // yard's extent on screen axes
    const k = Math.min(w / sw, h / sh) * ZOOM_LEVELS[camera.zoom];
    let cx = camera.cx, cy = camera.cy;
    if (camera.follow) { const p = pointOn(playerLoco().seg, playerLoco().s); cx = p.x; cy = p.y; }
    const fit = (c, lo, hi, seen) => hi - lo <= seen ? (lo + hi) / 2 : Math.max(lo + seen / 2, Math.min(hi - seen / 2, c));
    cx = fit(cx, BOUNDS.minX, BOUNDS.maxX, (turned ? h : w) / k);
    cy = fit(cy, BOUNDS.minY, BOUNDS.maxY, (turned ? w : h) / k);
    return {
      k, turned, cx, cy,
      toScreen: turned
        ? (x, y) => ({ x: w / 2 + (y - cy) * k, y: h / 2 - (x - cx) * k })
        : (x, y) => ({ x: w / 2 + (x - cx) * k, y: h / 2 + (y - cy) * k }),
    };
  }
  let screenW = 1, screenH = 1, view = makeView(1, 1);

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    screenW = r.width; screenH = r.height;
  }
  new ResizeObserver(resize).observe(canvas);

  function line(x1, y1, x2, y2, colour, width) {
    const a = view.toScreen(x1, y1), b = view.toScreen(x2, y2);
    ctx.strokeStyle = colour; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function polyline(points, colour, width) {
    ctx.strokeStyle = colour; ctx.lineWidth = width;
    ctx.beginPath();
    points.forEach((p, i) => { const c = view.toScreen(p.x, p.y); i ? ctx.lineTo(c.x, c.y) : ctx.moveTo(c.x, c.y); });
    ctx.stroke();
  }
  const endPoint = e => pointOn(e.seg, e.s);
  // A point `d` metres from `p` toward `q`.
  function toward(p, q, d) {
    const len = Math.hypot(q.x - p.x, q.y - p.y) || 1;
    return { x: p.x + (q.x - p.x) * d / len, y: p.y + (q.y - p.y) * d / len };
  }
  // Where each coupling is: the joint behind every vehicle but a train's last.
  function couplings() {
    const out = [];
    for (const id in state.trains) {
      const t = state.trains[id];
      for (let i = 0; i < t.vehicles.length - 1; i++) {
        const v = state.vehicles[t.vehicles[i]];
        out.push({ vehicle: v.id, key: pairKey(v.id, t.vehicles[i + 1]), at: endPoint(vehicleEnds(v).tail) });
      }
    }
    return out;
  }

  function render() {
    view = makeView(screenW, screenH);
    const k = view.k;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = "round";
    const trackWidth = Math.max(3, k);
    const detailed = k >= TRACK_DETAIL_K;
    polyline(SCENERY.mainLine, PALETTE.scenery, trackWidth);
    // A stretch of track, `s0` to `s1` along segment `id`: zoomed out a
    // single line; zoomed in two rails on ties.
    function drawTrack(id, s0, s1, alpha) {
      const pts = trackPoints(id, s0, s1);
      ctx.globalAlpha = alpha;
      if (!detailed) { polyline(pts, PALETTE.trackFar, trackWidth); ctx.globalAlpha = 1; return; }
      const half = GAUGE / 2, len = Math.abs(s1 - s0), dir = Math.sign(s1 - s0) || 1;
      ctx.lineCap = "butt";
      ctx.strokeStyle = PALETTE.ties; ctx.lineWidth = Math.max(1.5, k * 0.25);  // ties, in one path
      ctx.beginPath();
      for (let d = TIE_SPACING / 2; d < len; d += TIE_SPACING) {
        const p = pointOn(id, s0 + dir * d), h = TIE_LENGTH / 2;
        const e1 = view.toScreen(p.x - p.uy * h, p.y + p.ux * h), e2 = view.toScreen(p.x + p.uy * h, p.y - p.ux * h);
        ctx.moveTo(e1.x, e1.y); ctx.lineTo(e2.x, e2.y);
      }
      ctx.stroke();
      for (const side of [-1, 1])                                        // rails
        polyline(pts.map(p => ({ x: p.x - p.uy * half * side, y: p.y + p.ux * half * side })), PALETTE.rails, Math.max(1.2, k * 0.12));
      ctx.lineCap = "round";
      ctx.globalAlpha = 1;
    }
    // The leg a switch is not set to fades in from the switch, so the route
    // through the points reads at a glance.
    const dimmed = {};
    for (const id in SWITCHES) for (const leg of SWITCHES[id].legs)
      if (leg !== state.switches[id].set) (dimmed[leg] = dimmed[leg] || []).push(SEGMENTS[leg].a === id ? "a" : "b");
    // Faded stretches go down first, so the set route draws over them where
    // the legs still overlap. They fade in from the switch in a few steps.
    const solid = [];
    for (const id in SEGMENTS) {
      const len = segmentLength(id), ends = dimmed[id] || [], reach = Math.min(SWITCH_DIM_LENGTH, len / 2);
      const s0 = ends.includes("a") ? reach : 0, s1 = ends.includes("b") ? len - reach : len;
      solid.push([id, s0, s1]);
      for (let i = 0; i < SWITCH_DIM_STEPS; i++) {
        const f0 = i / SWITCH_DIM_STEPS, f1 = (i + 1) / SWITCH_DIM_STEPS, alpha = 0.3 + 0.7 * f0;
        if (s0 > 0) drawTrack(id, s0 * f0, s0 * f1, alpha);
        if (s1 < len) drawTrack(id, len - (len - s1) * f0, len - (len - s1) * f1, alpha);
      }
    }
    for (const [id, s0, s1] of solid) drawTrack(id, s0, s1, 1);
    // Buffer stops at every end of track.
    for (const id in NODES) {
      if (SEGMENTS_AT[id].length !== 1) continue;
      const seg = SEGMENTS_AT[id][0], p = pointOn(seg, SEGMENTS[seg].a === id ? 0 : segmentLength(seg));
      line(p.x - p.uy * 2, p.y + p.ux * 2, p.x + p.uy * 2, p.y - p.ux * 2, PALETTE.buffer, Math.max(3, k * 0.8));
    }

    // Switch targets, after FA practice (RGF art. 100): a green disc when the
    // switch is set normal, a yellow triangle on black when it is reversed,
    // pointing along the leg it is set to.
    for (const id in SWITCHES) {
      const n = NODES[id], set = state.switches[id].set, normal = set === SWITCHES[id].normal;
      const len = segmentLength(set), atA = SEGMENTS[set].a === id;
      const c = view.toScreen(n.x, n.y), r = Math.max(6, k * 1.6);
      const ahead = pointOn(set, atA ? Math.min(6, len) : len - Math.min(6, len)), q = view.toScreen(ahead.x, ahead.y);
      const dl = Math.hypot(q.x - c.x, q.y - c.y) || 1, ux = (q.x - c.x) / dl, uy = (q.y - c.y) / dl;
